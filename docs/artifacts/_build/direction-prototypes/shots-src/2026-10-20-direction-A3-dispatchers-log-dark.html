/* Prototype chrome (not product UI): identical in every direction file. */
[hidden] { display: none !important; }
.proto-bar { position: sticky; top: 0; z-index: 40; height: 40px; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 8px 0 14px; background: #262A31; color: #F1F3F6; font: 500 13px/1.2 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
.pb-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.pb-name b { font-weight: 700; margin-right: 2px; }
.pb-tools { display: flex; gap: 4px; flex: none; }
.pb-btn { display: inline-flex; align-items: center; min-height: 32px; padding: 0 10px; border-radius: 4px; background: #3A404A; color: #F1F3F6; border: 0; font: inherit; text-decoration: none; cursor: pointer; white-space: nowrap; }
.pb-btn:hover { background: #4A515D; }
.proto-bar :focus-visible, #jump-menu :focus-visible { outline: 2px solid #A9C6FF; outline-offset: 1px; }
@media (max-width: 560px) { .pb-long { display: none; } }
#jump-menu { position: fixed; inset: 44px 8px auto auto; margin: 0; width: min(360px, calc(100vw - 16px)); padding: 6px; border: 0; border-radius: 6px; background: #262A31; color: #F1F3F6; box-shadow: 0 18px 44px -14px rgba(0, 0, 0, .6); font: 500 13px/1.3 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
#jump-menu ol { list-style: none; margin: 0; padding: 0; }
#jump-menu a { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: center; min-height: 40px; padding: 6px 8px; border-radius: 4px; color: inherit; text-decoration: none; }
#jump-menu a:hover, #jump-menu a[aria-current] { background: #3A404A; }
#jump-menu a[aria-current] .pj-l { font-weight: 700; }
.pj-n { font-variant-numeric: tabular-nums; color: #BAC1CD; }
.pj-s, .pj-h, .pj-f { font-size: 12px; color: #BAC1CD; }
.pj-h, .pj-f { margin: 6px 8px; }

/* A3 · Dispatcher's log. Soft cool-grey ground, one white log column, turns grouped under a name line,
   soft 16px blocks, step cards, label-value rows with icons, filled time-range chips. Light first.
   Bricolage Grotesque (display) + Public Sans (body). */
:root {
  color-scheme: light dark;
  --display: "A3 Display", "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --sans: "A3 Sans", "Public Sans", "Helvetica Neue", Arial, sans-serif;
  --ground: #EDF0F5; --log: #FFFFFF; --soft: #F3F5F9; --soft-2: #E7EBF2;
  --ink: #1D2433; --ink-2: #545E72; --line: #8A93A6;
  --cust: #E2E7F9; --on-cust: #1D2433; --rep: #EEEAFA;
  --primary: #3346B0; --primary-hover: #283A97; --on-primary: #FFFFFF; --primary-soft: #E2E7F9; --on-primary-soft: #2B3C9E;
  --note: #FFF4D2; --on-note: #3F3200;
  --focus: #3346B0;
  --safety-band: #B3141D; --on-safety: #FFFFFF; --safety-tint: #FDEEEF; --safety-ink: #4E0A0E;
  --shadow: 0 1px 2px rgba(29, 36, 51, .05), 0 10px 30px -18px rgba(29, 36, 51, .30);
  --shadow-step: 0 1px 3px rgba(29, 36, 51, .07), 0 10px 26px -16px rgba(29, 36, 51, .30);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ground: #111419; --log: #181C24; --soft: #20252F; --soft-2: #2A303C;
--ink: #E6E9F0; --ink-2: #A6AFBF; --line: #6E788B;
--cust: #2A3459; --on-cust: #EEF1FB; --rep: #302A45;
--primary: #A9B5FF; --primary-hover: #C2CAFF; --on-primary: #141A3A; --primary-soft: #262F55; --on-primary-soft: #C9D0FF;
--note: #3A321C; --on-note: #F6E7BC;
--focus: #A9B5FF;
--safety-band: #B3141D; --on-safety: #FFFFFF; --safety-tint: #2C1517; --safety-ink: #F8DEDF;
--shadow: 0 0 0 1px rgba(255, 255, 255, .04);
--shadow-step: 0 0 0 1px rgba(255, 255, 255, .06); } }
:root[data-theme="dark"] { --ground: #111419; --log: #181C24; --soft: #20252F; --soft-2: #2A303C;
--ink: #E6E9F0; --ink-2: #A6AFBF; --line: #6E788B;
--cust: #2A3459; --on-cust: #EEF1FB; --rep: #302A45;
--primary: #A9B5FF; --primary-hover: #C2CAFF; --on-primary: #141A3A; --primary-soft: #262F55; --on-primary-soft: #C9D0FF;
--note: #3A321C; --on-note: #F6E7BC;
--focus: #A9B5FF;
--safety-band: #B3141D; --on-safety: #FFFFFF; --safety-tint: #2C1517; --safety-ink: #F8DEDF;
--shadow: 0 0 0 1px rgba(255, 255, 255, .04);
--shadow-step: 0 0 0 1px rgba(255, 255, 255, .06); }
:root[data-theme="light"] { color-scheme: light; } :root[data-theme="dark"] { color-scheme: dark; }


* { box-sizing: border-box; }
body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--sans); font-size: 1rem; line-height: 1.55; -webkit-font-smoothing: antialiased; }
#app { height: calc(100dvh - 40px); }
button, input, select { font: inherit; color: inherit; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
time, .lv-v, .tchip, .lines, .snap, .qr-d, .chip { font-variant-numeric: tabular-nums; }
h1, h2, h3 { text-wrap: balance; }
p { text-wrap: pretty; }

/* ---------- chrome ---------- */
.chat { height: 100%; display: flex; flex-direction: column; }
.ch-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "brand link" "demo demo"; align-items: center; gap: 8px 16px; padding: 12px clamp(16px, 3vw, 28px); }
.brand { grid-area: brand; min-width: 0; } .link-b { grid-area: link; } .demo-bar { grid-area: demo; display: flex; flex-wrap: wrap; gap: 6px; }
@media (min-width: 760px) { .ch-head { grid-template-columns: minmax(0, 1fr) auto auto; grid-template-areas: "brand demo link"; } .cs-head { grid-template-areas: "brand demo"; } }
.brand-n { margin: 0; font-family: var(--display); font-weight: 600; font-size: 1.3125rem; line-height: 1.2; letter-spacing: -.01em; }
.brand-s { margin: 2px 0 0; font-size: .875rem; color: var(--ink-2); }
.brand-s b { color: var(--ink); font-weight: 600; white-space: nowrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 30px; padding: 0 12px; border-radius: 999px; background: var(--log); color: var(--ink); font-size: .8125rem; font-weight: 500; box-shadow: var(--shadow); }
.chip .ic { width: 16px; height: 16px; color: var(--ink-2); }
.link-b { background: none; border: 0; color: var(--on-primary-soft); text-decoration: underline; text-underline-offset: 3px; font-size: .875rem; font-weight: 600; padding: 4px; min-height: 32px; cursor: pointer; }
.banner { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin: 0 clamp(12px, 3vw, 24px) 10px; padding: 10px 16px; border-radius: 14px; background: var(--log); font-size: .9375rem; box-shadow: var(--shadow); }
.banner p { margin: 0; display: flex; align-items: center; gap: 8px; }
.ch-main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr); width: 100%; }
.ch-col { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.panel { display: none; }
@media (min-width: 760px) {
  .ch-col { padding: 0 24px 16px; }
  .ch-col > * { width: 100%; max-width: 780px; margin-inline: auto; }
  .thread { border-radius: 22px 22px 0 0; }
  .composer { border-radius: 0 0 22px 22px; }
}
@media (min-width: 1024px) {
  .ch-main { grid-template-columns: minmax(0, 1fr) 360px; max-width: 1280px; margin: 0 auto; }
  .panel { display: block; overflow-y: auto; padding: 0 24px 16px 0; }
  .strip { display: none; }
}
.strip { margin: 0 12px 10px; border-radius: 14px; background: var(--log); box-shadow: var(--shadow); }
.strip > summary { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 8px 40px 8px 16px; cursor: pointer; list-style: none; position: relative; font-size: .875rem; }
.strip > summary::-webkit-details-marker { display: none; }
.strip > summary::after { content: ""; position: absolute; right: 18px; top: 50%; width: 8px; height: 8px; margin-top: -6px; border-right: 2px solid var(--ink-2); border-bottom: 2px solid var(--ink-2); transform: rotate(45deg); }
.strip[open] > summary::after { transform: rotate(-135deg); margin-top: -2px; }
.st-l { font-family: var(--display); font-weight: 600; white-space: nowrap; }
.st-b { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; min-width: 0; }
.st-b .ic { width: 15px; height: 15px; color: var(--ink-2); }
.st-none { color: var(--ink-2); }
.strip.is-safety { display: none; }
.strip-b { padding: 0 12px 12px; max-height: 52vh; overflow-y: auto; }

/* ---------- the log ---------- */
.thread { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; padding: 22px clamp(16px, 4vw, 32px) 26px; background: var(--log); }
.thread > * { max-width: 640px; }
.day-div { display: flex; align-items: center; gap: 12px; margin: 0; max-width: none !important; color: var(--ink-2); font-size: .8125rem; font-weight: 500; }
.day-div::before, .day-div::after { content: ""; flex: 1; height: 1px; background: var(--soft-2); }
.turn { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; container-type: inline-size; width: 100%; }
.turn.is-cont { margin-top: -12px; }
.name { display: flex; align-items: center; gap: 8px; margin: 0; font-size: .875rem; font-weight: 600; }
.name-mk { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 8px; background: var(--primary-soft); color: var(--on-primary-soft); }
.name-mk .ic { width: 15px; height: 15px; }
.name-rep { border-radius: 4px 12px 12px 12px; background: var(--rep); color: var(--ink); }
.blk { max-width: 62ch; padding: 11px 16px; border-radius: 16px; background: var(--soft); }
.blk b { font-weight: 700; }
.t { font-size: .75rem; color: var(--ink-2); }
.turn-customer { align-items: flex-end; align-self: flex-end; }
.turn-customer .blk { background: var(--cust); color: var(--on-cust); border-radius: 16px 16px 4px 16px; }
.turn-rep .blk { background: var(--rep); border-radius: 4px 16px 16px 16px; }
.is-quiet .blk { background: transparent; padding-inline: 0; color: var(--ink-2); }
.logevt { width: 100%; max-width: 640px; }
.evt { display: flex; align-items: center; gap: 10px; margin: 0; font-size: .875rem; }
.evt-i { display: grid; place-items: center; width: 28px; height: 28px; flex: none; border-radius: 50%; background: var(--soft); color: var(--ink-2); }
.evt-i .ic { width: 16px; height: 16px; }
.evt-t { flex: 1; font-weight: 500; }
.evt time { color: var(--ink-2); font-size: .8125rem; }
.evt-good .evt-i { background: var(--primary-soft); color: var(--on-primary-soft); }
.evt-in { margin-top: 12px; }
.evt-log { margin: 4px 0 10px; }
.srcs { display: flex; flex-wrap: wrap; gap: 6px; }
.src > summary { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; min-height: 32px; padding: 4px 12px; border-radius: 999px; background: var(--soft); font-size: .8125rem; cursor: pointer; list-style: none; }
.src > summary::-webkit-details-marker { display: none; }
.src > summary .ic { width: 15px; height: 15px; color: var(--ink-2); }
.src-v { color: var(--ink-2); }
.src[open] > summary { background: var(--primary-soft); color: var(--on-primary-soft); }
.src[open] .src-v { color: inherit; }
.src-b { margin-top: 6px; padding: 10px 14px; max-width: 62ch; border-radius: 14px; background: var(--soft); font-size: .9375rem; }
.src-b p { margin: 6px 0 0; color: var(--ink-2); }

/* step cards */
.step { width: 100%; max-width: 560px; border-radius: 18px; background: var(--log); box-shadow: var(--shadow-step); }
.step-h { display: flex; align-items: center; gap: 12px; padding: 14px 18px 4px; }
.step-i { display: grid; place-items: center; width: 34px; height: 34px; flex: none; border-radius: 12px; background: var(--primary-soft); color: var(--on-primary-soft); }
.step-tt { display: flex; flex-direction: column; }
.step-k { font-size: .75rem; color: var(--ink-2); font-weight: 500; }
.step-t { margin: 0; font-family: var(--display); font-weight: 600; font-size: 1.0625rem; line-height: 1.25; }
.step-b { padding: 8px 18px 18px; }
.checks { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: .9375rem; }
.q-t { margin: 0; font-weight: 600; font-size: 1.0625rem; }
.acts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 14px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 20px; border: 0; border-radius: 999px; font-weight: 600; cursor: pointer; text-align: center; }
.btn .ic { width: 18px; height: 18px; }
.btn-p { background: var(--primary); color: var(--on-primary); }
.btn-p:hover { background: var(--primary-hover); }
.btn-q { background: var(--soft-2); color: var(--ink); }
.btn-q:hover { background: var(--primary-soft); }
.btn-s { min-height: 36px; padding: 0 14px; font-size: .875rem; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.in { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.in > span { font-size: .8125rem; font-weight: 600; }
.in input, select { width: 100%; min-width: 0; min-height: 46px; padding: 0 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--log); color: var(--ink); }
.inl { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px; }
.inl .in { flex: 1 1 180px; }
.in-code input { letter-spacing: .3em; font-size: 1.25rem; font-variant-numeric: tabular-nums; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@container (max-width: 420px) { .two { grid-template-columns: 1fr; } }
.err { margin: 10px 0 0; font-weight: 600; font-size: .9375rem; }
.err::before { content: "! "; }
.hint { margin: 10px 0 0; font-size: .8125rem; color: var(--ink-2); }
.links { margin: 10px 0 0; }
.links a { color: var(--on-primary-soft); font-weight: 600; }

/* label-value rows */
.lvs, .rows { display: grid; gap: 2px; }
.rows { width: 100%; max-width: 560px; padding: 6px 18px 10px; border-radius: 18px; background: var(--soft); }
.lv { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; align-items: start; padding: 7px 0; }
.lv-i { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 10px; background: var(--soft); color: var(--ink-2); }
.rows .lv-i { background: var(--log); }
.lv-i .ic { width: 16px; height: 16px; }
.lv-t { display: flex; flex-direction: column; min-width: 0; }
.lv-l { font-size: .8125rem; color: var(--ink-2); }
.lv-v { font-weight: 500; overflow-wrap: anywhere; }

/* slot card */
.week { margin-top: 14px; }
.week-h { margin: 0 0 8px; font-size: .875rem; font-weight: 600; }
.dayrow { display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 10px; align-items: center; padding: 6px 0; }
@container (max-width: 440px) { .dayrow { grid-template-columns: 1fr; gap: 4px; } }
.dr-d { font-size: .875rem; font-weight: 600; }
.dr-full { font-size: .875rem; color: var(--ink-2); }
.dr-c { display: flex; flex-wrap: wrap; gap: 6px; }
.tchip { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border: 0; border-radius: 999px; background: var(--primary-soft); color: var(--on-primary-soft); font-weight: 600; font-size: .9375rem; cursor: pointer; }
.tchip:hover:not(:disabled) { background: var(--soft-2); color: var(--ink); }
.tchip .ic { width: 16px; height: 16px; }
.tchip.is-taken { background: transparent; color: var(--ink-2); font-weight: 400; text-decoration: line-through; cursor: not-allowed; padding-inline: 4px; }
.tchip-x { text-decoration: none; display: inline-block; margin-left: 2px; }
.tchip.is-sel { background: var(--primary); color: var(--on-primary); }
.tchip:disabled:not(.is-taken):not(.is-sel) { opacity: .6; }

/* account + handoff */
.lines { width: 100%; margin: 6px 0 4px; border-collapse: collapse; }
.lines th, .lines td { padding: 6px 0; text-align: left; font-weight: 400; }
.lines td:last-child, .lines thead th:last-child { text-align: right; }
.lines thead th { font-size: .8125rem; color: var(--ink-2); }
.lines tfoot th, .lines tfoot td { font-weight: 700; padding-top: 10px; }
.reason { margin: 0 0 6px; color: var(--ink-2); font-size: .9375rem; }
.promise { margin: 0 0 8px; font-size: 1.0625rem; font-weight: 500; }
.saved { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; margin-top: 12px; padding: 12px 14px; border-radius: 14px; background: var(--primary-soft); color: var(--on-primary-soft); }
.saved p { margin: 0; flex: 1 1 200px; font-weight: 500; }
.fu { border: 0; margin: 12px 0 0; padding: 0; min-width: 0; }
.fu legend { padding: 0 0 8px; font-weight: 600; }
.radio { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; align-items: center; min-height: 48px; margin-bottom: 6px; padding: 10px 14px; border-radius: 14px; background: var(--soft); cursor: pointer; }
.radio:has(input:checked) { background: var(--primary-soft); }
.radio input { width: 18px; height: 18px; margin: 0; accent-color: var(--primary); }
.radio small { display: block; color: var(--ink-2); font-size: .8125rem; }

/* ---------- safety: outside the log, the only red ---------- */
.pinned { flex: none; padding: 0 12px 10px; }
@media (min-width: 760px) { .pinned { padding: 0 0 12px; } }
.safety { overflow: hidden; border-radius: 18px; background: var(--safety-tint); color: var(--safety-ink); box-shadow: var(--shadow); }
.sf-band { display: flex; align-items: center; gap: 10px; padding: 12px 18px; background: var(--safety-band); color: var(--on-safety); }
.sf-w { margin: 0; font-family: var(--display); font-weight: 700; font-size: 1.375rem; letter-spacing: .1em; }
.ic-warn { width: 26px; height: 26px; color: var(--on-safety); flex: none; }
.sf-list { list-style: none; margin: 0; padding: 14px 18px 16px; display: grid; gap: 10px; }
.sf-list li { display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: start; }
.sf-n { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--safety-band); color: var(--on-safety); font-weight: 700; }
.sf-list p { margin: 0; font-size: 1.125rem; font-weight: 600; line-height: 1.4; }
.safety-panel .sf-list p { font-size: 1rem; }
/* the log greys out below the pinned instruction; the last line (the quiet offer) stays live */
#app[data-safety] .thread > :not(:last-child) { color: var(--ink-2); filter: grayscale(1); }
#app[data-safety] .thread > :not(:last-child) .blk, #app[data-safety] .thread > :not(:last-child) .step, #app[data-safety] .thread > :not(:last-child) .rows { background: var(--soft); color: var(--ink-2); box-shadow: none; }

/* ---------- composer ---------- */
.composer { flex: none; padding: 10px clamp(12px, 3vw, 24px) 14px; background: var(--log); border-top: 1px solid var(--soft-2); }
.cp-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 10px; margin-bottom: 8px; }
.talk { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 16px; border: 0; border-radius: 999px; background: var(--primary-soft); color: var(--on-primary-soft); font-weight: 600; cursor: pointer; }
.talk:hover { background: var(--soft-2); color: var(--ink); }
.cp-hint { font-size: .75rem; color: var(--ink-2); }
.cp-row { display: flex; align-items: center; gap: 8px; }
.cp-row input { flex: 1; min-width: 0; min-height: 50px; padding: 0 20px; border: 1px solid var(--line); border-radius: 999px; background: var(--log); color: var(--ink); }
.send { flex: none; display: grid; place-items: center; width: 50px; height: 50px; border: 0; border-radius: 50%; background: var(--primary); color: var(--on-primary); cursor: pointer; }
.send:hover { background: var(--primary-hover); }

/* ---------- what's settled ---------- */
.panel > * { max-width: 336px; }
.pn-h { padding: 4px 4px 12px; }
.pn-h h2 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 1.1875rem; }
.pn-h p { margin: 2px 0 0; font-size: .875rem; color: var(--ink-2); }
.pn-s { margin-bottom: 12px; padding: 14px 16px; border-radius: 18px; background: var(--log); box-shadow: var(--shadow); }
.pn-s h3 { display: flex; align-items: center; gap: 8px; margin: 0 0 6px; font-family: var(--display); font-weight: 600; font-size: 1rem; }
.pn-s h3 .ic { color: var(--ink-2); }
.pn-s > p { margin: 0; font-size: .9375rem; }
.pn-s.is-empty { background: transparent; box-shadow: none; padding-block: 8px; }
.pn-s.is-empty > p { color: var(--ink-2); }
.strip-b .pn-s { box-shadow: none; background: var(--soft); }

/* ---------- staff console (S2) ---------- */
.console { min-height: 100%; display: flex; flex-direction: column; }
.case-root { flex: 1; min-height: 0; }
.cs-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; padding: 0 clamp(12px, 2vw, 20px) 20px; }
.q-col, .brief, .evidence { min-width: 0; }
.q-col { border-radius: 20px; background: var(--log); box-shadow: var(--shadow); }
.q-sum { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 16px; cursor: pointer; font-weight: 600; }
.q-in { padding: 4px 10px 12px; }
.col-h { padding: 8px 6px 4px; }
.col-h h2 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 1.1875rem; }
.col-h p { margin: 2px 0 0; font-size: .875rem; color: var(--ink-2); }
.q-g { margin: 14px 6px 6px; font-size: .8125rem; font-weight: 600; color: var(--ink-2); }
.qlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.qrow { width: 100%; display: grid; gap: 3px; padding: 12px; border: 0; border-radius: 14px; background: transparent; text-align: left; cursor: pointer; }
.qrow:hover { background: var(--soft); }
.qrow.is-sel { background: var(--primary-soft); }
.qr-1 { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.qr-n { font-weight: 700; }
.qr-r { font-size: .875rem; }
.qr-d { display: flex; align-items: center; gap: 6px; font-size: .8125rem; color: var(--ink-2); }
.qr-d .ic { width: 15px; height: 15px; }
.qr-d.is-over { color: var(--ink); }
.qr-p { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: .8125rem; color: var(--ink-2); }
.ptag { display: inline-flex; align-items: center; min-height: 24px; padding: 0 10px; border-radius: 8px; font-size: .75rem; font-weight: 600; white-space: nowrap; }
.ptag-P0, .ptag-P1 { background: var(--ink); color: var(--log); }
.ptag-P2, .ptag-P3, .ptag-P4 { background: var(--soft-2); color: var(--ink); }
.brief { min-width: 0; }
.card { border-radius: 20px; background: var(--log); box-shadow: var(--shadow); padding: 18px 20px; }
.case-card { padding: 22px clamp(16px, 3vw, 28px) 20px; }
.case-l { display: flex; align-items: center; gap: 10px; margin: 0; font-size: .875rem; color: var(--ink-2); }
.case-t { margin: 8px 0 10px; font-family: var(--display); font-weight: 600; font-size: 1.75rem; line-height: 1.15; letter-spacing: -.01em; }
.evt-status { margin-bottom: 14px; }
.promise-b { padding: 6px 16px 8px; border-radius: 16px; background: var(--soft); }
.promise-b .lv-i { background: var(--log); }
.bsecs { margin-top: 10px; }
.bsec { padding: 6px 0; border-bottom: 1px solid var(--soft-2); }
.bsec > summary { display: flex; align-items: center; gap: 10px; min-height: 44px; cursor: pointer; list-style: none; font-family: var(--display); font-weight: 600; font-size: 1.0625rem; }
.bsec > summary::-webkit-details-marker { display: none; }
.bsec > summary::after { content: ""; margin-left: auto; width: 7px; height: 7px; border-right: 2px solid var(--ink-2); border-bottom: 2px solid var(--ink-2); transform: rotate(45deg); }
.bsec[open] > summary::after { transform: rotate(-135deg); }
.bs-n { display: grid; place-items: center; width: 26px; height: 26px; flex: none; border-radius: 9px; background: var(--primary-soft); color: var(--on-primary-soft); font-family: var(--sans); font-size: .8125rem; font-weight: 700; }
.bsec ul { list-style: none; margin: 0 0 10px; padding: 0 0 0 36px; display: grid; gap: 8px; }
.bsec li { display: flex; gap: 8px; align-items: baseline; }
.bsec li .ic { width: 16px; height: 16px; color: var(--on-primary-soft); transform: translateY(3px); }
.bsec-quote li { font-weight: 500; }
.bsec-claim ul { margin-left: 36px; padding: 10px 14px; border-radius: 14px; background: var(--note); color: var(--on-note); font-style: italic; }
.nc { display: flex; align-items: center; gap: 6px; margin: 0 0 8px 36px; font-size: .8125rem; color: var(--ink-2); }
.nc .ic { width: 15px; height: 15px; }
.srcchip { display: inline-flex; align-items: center; gap: 4px; min-height: 28px; margin-left: 4px; padding: 0 10px; border: 0; border-radius: 999px; background: var(--soft-2); color: var(--ink); font-size: .75rem; font-weight: 500; font-style: normal; cursor: pointer; vertical-align: 1px; }
.srcchip:hover { background: var(--primary-soft); color: var(--on-primary-soft); }
.srcchip .ic { width: 13px; height: 13px; transform: none !important; color: inherit !important; }
.cacts { margin-top: 16px; }
.cbtn { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border: 0; border-radius: 8px; background: var(--soft-2); color: var(--ink); font-weight: 600; font-size: .9375rem; cursor: pointer; }
.cbtn:hover:not(:disabled) { background: var(--primary-soft); }
.cbtn-p { background: var(--primary); color: var(--on-primary); }
.cbtn-p:hover:not(:disabled) { background: var(--primary-hover); }
.cbtn:disabled { opacity: .5; cursor: not-allowed; }
.cbtn .ic { width: 16px; height: 16px; }
.cacts .acts { margin-top: 0; }
.mini { margin-top: 12px; padding: 14px; border-radius: 14px; background: var(--soft); }
.mini .radio { background: var(--log); }
.activity { display: grid; gap: 8px; margin-top: 16px; }
.tabs { display: flex; gap: 4px; margin: 10px 0 12px; padding: 4px; border-radius: 999px; background: var(--log); box-shadow: var(--shadow); }
.tabs [role="tab"] { flex: 1; min-height: 38px; border: 0; border-radius: 999px; background: transparent; color: var(--ink); font-weight: 600; font-size: .875rem; cursor: pointer; }
.tabs [aria-selected="true"] { background: var(--primary-soft); color: var(--on-primary-soft); }
.src-card { margin-bottom: 12px; scroll-margin-top: 12px; }
.src-card h3 { display: flex; align-items: center; gap: 8px; margin: 0; font-family: var(--display); font-weight: 600; font-size: 1.0625rem; }
.src-card h3 .ic { color: var(--ink-2); }
.src-meta { margin: 4px 0 10px; font-size: .8125rem; color: var(--ink-2); overflow-wrap: anywhere; }
.snap { width: 100%; border-collapse: collapse; font-size: .875rem; }
.snap th, .snap td { padding: 6px 6px 6px 0; text-align: left; vertical-align: top; }
.snap thead th { font-size: .8125rem; font-weight: 600; }
.snap small { display: block; font-weight: 400; color: var(--ink-2); }
.snap tbody th { font-weight: 400; color: var(--ink-2); }
.snap tbody tr:nth-child(odd) { background: var(--soft); }
.quote { margin: 0 0 8px; padding: 12px 14px; border-radius: 14px; background: var(--soft); font-size: .9375rem; }
.fact { display: flex; flex-direction: column; gap: 2px; margin: 10px 0 0; font-weight: 600; }
.fact span { font-size: .8125rem; font-weight: 500; color: var(--ink-2); }
.thread-mini { padding: 16px; border-radius: 20px; gap: 16px; background: var(--log); box-shadow: var(--shadow); overflow: visible; }
.thread-mini > * { max-width: none; }
.note { padding: 12px 14px; border-radius: 4px 14px 14px 14px; background: var(--note); color: var(--on-note); }
.note p { margin: 0; }
.note-h { display: flex; align-items: center; gap: 6px; margin-bottom: 4px !important; font-size: .8125rem; font-weight: 700; }
.note-h .ic { width: 15px; height: 15px; }
.note .t { color: var(--on-note); }
@media (min-width: 760px) and (max-width: 1099px) { .cs-grid { grid-template-columns: minmax(0, 1fr) 340px; } .q-col { grid-column: 1 / -1; } }
@media (min-width: 1100px) {
  #app[data-view="case"] .console { height: 100%; }
  .cs-grid { height: 100%; grid-template-columns: 320px minmax(0, 1fr) 380px; }
  .q-col, .brief, .evidence { overflow-y: auto; min-height: 0; }
  .q-sum { display: none; }
}
@media (max-width: 1099px) { #app[data-view="case"] { height: auto; min-height: calc(100dvh - 40px); } }

/* ---------- dialog + toast ---------- */
.inbox { width: calc(100% - 32px); max-width: 440px; padding: 22px; border: 0; border-radius: 22px; background: var(--log); color: var(--ink); box-shadow: 0 24px 60px -24px rgba(0, 0, 0, .45); }
.inbox::backdrop { background: rgba(17, 20, 25, .45); }
.inbox h2 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 1.25rem; }
.inbox .hint { margin: 4px 0 14px; }
.inbox-m { padding: 14px 16px; border-radius: 16px; background: var(--soft); }
.inbox-m p { margin: 0; }
#toast { position: fixed; left: 50%; bottom: 140px; transform: translateX(-50%); width: max-content; max-width: min(92vw, 420px); padding: 10px 16px; border-radius: 999px; background: var(--ink); color: var(--log); font-size: .9375rem; opacity: 0; pointer-events: none; z-index: 60; }
#toast.is-on { opacity: 1; }

@media (max-width: 480px) {
  .rows, .step { border-radius: 16px; }
  .step-h { padding-inline: 14px; } .step-b { padding-inline: 14px; } .rows { padding-inline: 14px; }
}

/* ---------- motion: opt-in only ---------- */
@media (prefers-reduced-motion: no-preference) {
  .is-arriving { animation: a3-in .26s ease-out both; }
  .logevt.is-join.is-arriving { animation: a3-slide .32s ease-out both; }
  .is-arriving .pulse { animation: a3-pulse 1s ease-out .3s 1; }
  .is-hl { animation: a3-hl 1.6s ease-out; }
  .btn, .tchip, .radio, .qrow, .cbtn, .talk { transition: background-color .15s ease-out, color .15s ease-out; }
  #toast { transition: opacity .2s; }
}
@keyframes a3-in { from { opacity: 0; transform: translateY(6px); } }
@keyframes a3-slide { from { opacity: 0; transform: translateX(-12px); } }
@keyframes a3-pulse { 0% { box-shadow: 0 0 0 0 var(--primary-soft); } 60% { box-shadow: 0 0 0 8px var(--primary-soft); } 100% { box-shadow: 0 0 0 0 transparent; } }
@keyframes a3-hl { 0%, 35% { background-color: var(--primary-soft); } }

</style>
</head>
<body>
<noscript><p style="padding:16px">This direction prototype needs JavaScript to play its scripted story.</p></noscript>
<div id="app"></div>
<script>
/* A3 · Dispatcher's log: markup construction. The conversation is a calm log: turns grouped by speaker
   under a name line, soft 16px blocks, event lines with icons and times, the assistant's working steps as
   step cards, appointments as label-value rows with icons. Read by the shared engine as window.SKIN. */
(function () {
  'use strict';
  var I = {
    person: '<circle cx="10" cy="7" r="3"/><path d="M4.5 16.5c.7-2.9 2.9-4.5 5.5-4.5s4.8 1.6 5.5 4.5"/>',
    send: '<path d="M10 15.5v-11M5.5 9 10 4.5 14.5 9"/>',
    cal: '<rect x="3.5" y="4.5" width="13" height="12" rx="2.5"/><path d="M3.5 8.5h13M7 3v3M13 3v3"/>',
    clock: '<circle cx="10" cy="10" r="6.5"/><path d="M10 6.5V10l2.5 1.5"/>',
    pin: '<path d="M10 17s5-4.6 5-8.5a5 5 0 1 0-10 0C5 12.4 10 17 10 17Z"/><circle cx="10" cy="8.5" r="1.8"/>',
    receipt: '<path d="M5.5 3.5h9v13l-1.5-1-1.5 1-1.5-1-1.5 1-1.5-1-1.5 1z"/><path d="M8 7.5h4M8 10.5h4"/>',
    check: '<path d="m5 10.5 3 3 7-7"/>',
    info: '<circle cx="10" cy="10" r="6.5"/><path d="M10 9v4.5M10 6.6v.1"/>',
    shield: '<path d="M10 3.5 15.5 5.5v4.2c0 3.2-2.3 5.8-5.5 6.8-3.2-1-5.5-3.6-5.5-6.8V5.5z"/><path d="m7.6 10 1.7 1.7 3.2-3.2"/>',
    tool: '<path d="M12.5 4a3.5 3.5 0 0 0-3.3 4.6L4 13.8 6.2 16l5.2-5.2A3.5 3.5 0 0 0 16 7.5l-2 2-2-.5-.5-2 2-2a3.5 3.5 0 0 0-1-.5Z"/>',
    phone: '<path d="M6 3.5h2.5l1 3.5-1.7 1.2a8 8 0 0 0 4 4l1.2-1.7 3.5 1v2.5a1.5 1.5 0 0 1-1.6 1.5C9 15.2 4.8 11 4.5 5.1A1.5 1.5 0 0 1 6 3.5Z"/>',
    mail: '<rect x="3.5" y="5" width="13" height="10" rx="2"/><path d="m4 5.5 6 5 6-5"/>',
    lock: '<rect x="5" y="9" width="10" height="7.5" rx="2"/><path d="M7.5 9V7a2.5 2.5 0 0 1 5 0v2"/>',
    flag: '<path d="M5.5 16.5V4M5.5 4.5h8l-1.6 3 1.6 3h-8"/>',
    doc: '<path d="M6 3.5h5.5L15 7v9.5H6z"/><path d="M11 3.5V7h4M8 10.5h5M8 13h5"/>',
    pause: '<circle cx="10" cy="10" r="6.5"/><path d="M8.5 7.5v5M11.5 7.5v5"/>',
    wait: '<path d="M6.5 3.5h7M6.5 16.5h7M7 3.5c0 3.5 6 3.5 6 6.5s-6 3-6 6.5M13 3.5c0 3.5-6 3.5-6 6.5"/>',
    hand: '<path d="M7 10V5.5a1.3 1.3 0 0 1 2.6 0V9M9.6 9V4.3a1.3 1.3 0 0 1 2.6 0V9M12.2 9V5.5a1.3 1.3 0 0 1 2.6 0v5.5a5.5 5.5 0 0 1-9.6 3.7L3.6 12a1.3 1.3 0 0 1 2-1.7L7 11.6"/>',
    question: '<circle cx="10" cy="10" r="6.5"/><path d="M8.2 8.2a1.9 1.9 0 1 1 2.6 1.8c-.5.2-.8.6-.8 1.2v.3M10 13.8v.1"/>',
    chat: '<path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h9A1.5 1.5 0 0 1 16 5.5v6a1.5 1.5 0 0 1-1.5 1.5H9l-3.5 3v-3h0A1.5 1.5 0 0 1 4 11.5z"/>'
  };
  function ic(n) { return '<svg class="ic" viewBox="0 0 20 20" aria-hidden="true" focusable="false">' + (I[n] || I.info) + '</svg>'; }
  function warnSolid() { return '<svg class="ic-warn" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 2.6 23 21.4H1z" fill="currentColor"/><path d="M12 9v6M12 17.6v.2" stroke="var(--safety-band)" stroke-width="2.4" stroke-linecap="round"/></svg>'; }
  function lv(icon, label, value, cls) { return '<div class="lv ' + (cls || '') + '"><span class="lv-i">' + ic(icon) + '</span><span class="lv-t"><span class="lv-l">' + label + '</span><span class="lv-v">' + value + '</span></span></div>'; }
  function evt(icon, text, time, cls) { return '<p class="evt ' + (cls || '') + '"><span class="evt-i">' + ic(icon) + '</span><span class="evt-t">' + text + '</span>' + (time ? '<time>' + time + '</time>' : '') + '</p>'; }
  function step(icon, title, kicker, body, cls) {
    return '<section class="step ' + (cls || '') + '"><header class="step-h"><span class="step-i">' + ic(icon) + '</span><span class="step-tt"><span class="step-k">' + kicker + '</span><h3 class="step-t">' + title + '</h3></span></header><div class="step-b">' + body + '</div></section>';
  }
  function sources(keys, c) {
    return '<div class="srcs">' + keys.map(function (k) {
      var s = c.SRC[k];
      return '<details class="src"><summary>' + ic('doc') + '<span>' + s.file + '</span><span class="src-v">' + s.ver + '</span></summary><div class="src-b"><q>' + s.quote + '</q>' + (s.note ? '<p>' + s.note + '</p>' : '') + '</div></details>';
    }).join('') + '</div>';
  }

  /* ---------- step cards and rows ---------- */
  function cChecks(S, c) {
    var st = S.cards.checks || {};
    var body = '<ol class="checks">' + c.CHECKS.map(function (t) { return '<li>' + t + '</li>'; }).join('') + '</ol>' +
      (st.done ? evt('check', st.choice === 'skip' ? 'Checks skipped' : 'Tried. Still not cooling', '', 'evt-in')
        : '<div class="acts"><button type="button" class="btn btn-p" data-act="choose" data-key="checks" data-val="skip" data-fk="checks-skip">Skip the checks</button>' +
          '<button type="button" class="btn btn-q" data-act="choose" data-key="checks" data-val="tried" data-fk="checks-tried">I tried them. Still not cooling</button></div>');
    return step('tool', 'Quick checks', 'Optional', body);
  }
  function cQuestion(card, S) {
    var st = S.cards[card.key] || {};
    var body = '<p class="q-t">' + card.q + '</p>' + (st.done ? evt('check', 'Answered: ' + { yes: 'Yes', no: 'No', skip: 'Skipped' }[st.choice], '', 'evt-in')
      : '<div class="acts" role="group" aria-label="Answer">' + [['yes', 'Yes'], ['no', 'No'], ['skip', 'Skip']].map(function (o) {
        return '<button type="button" class="btn btn-q" data-act="choose" data-key="' + card.key + '" data-val="' + o[0] + '" data-fk="' + card.key + '-' + o[0] + '">' + o[1] + '</button>';
      }).join('') + '</div>');
    return step('question', 'Question ' + card.n + ' of 2', 'Optional', body, 'step-q');
  }
  function cWhere(S, c) {
    var st = S.cards.where || {};
    var body = st.done ? lv('pin', 'Visit area', 'Kyle 78640 · our south zone')
      : '<form class="inl" data-form="where" novalidate><label class="in"><span>ZIP code or city</span><input id="where-input" data-bind="where.value" data-fk="where-input" value="' + c.esc(st.value || '') + '" autocomplete="postal-code"' + (st.err ? ' aria-invalid="true"' : '') + '></label>' +
        '<button class="btn btn-p" data-fk="where-go">Show windows</button></form>' + (st.err ? '<p class="err" role="alert">' + st.err + '</p>' : '');
    return step('pin', 'Where is the visit?', 'Assistant step', body);
  }
  function cSlots(S, c) {
    var st = S.cards.slots || {};
    var head = '<div class="lvs">' + lv('tool', 'Service', 'Repair visit · AC not cooling') + lv('pin', 'Area', 'Kyle 78640 · south zone') +
      lv('receipt', 'Standard fee', '$89 diagnostic visit · credited toward the repair if you approve it at the same visit') + '</div>';
    var days = '<div class="week"><p class="week-h">This week · Oct 19 – 24 · arrival windows</p>' + c.DAYS.map(function (d) {
      var chips = d.wins.filter(function (w) { return w[1] === 'open'; }).map(function (w) {
        var W = c.WIN[w[0]], sel = st.day === d.key && st.win === w[0];
        return '<button type="button" class="tchip' + (sel ? ' is-sel' : '') + '" data-act="slot-win" data-day="' + d.key + '" data-val="' + w[0] + '" data-fk="chip-' + d.d + '-' + w[0] + '" aria-pressed="' + sel + '"' + (st.done ? ' disabled' : '') + '>' +
          (sel ? ic('check') : '') + W.label + '</button>';
      }).join('');
      return '<div class="dayrow"><span class="dr-d">' + d.dow + ', Oct ' + d.d + '</span><span class="dr-c">' + (chips || '<span class="dr-full">Full, no open windows</span>') + '</span></div>';
    }).join('') + '</div>';
    var foot = st.done
      ? evt('check', 'Window chosen: ' + (function () { var d = null; c.DAYS.forEach(function (x) { if (x.key === st.day) d = x; }); return d.long + ', ' + c.WIN[st.win].label; })(), '', 'evt-in')
      : '<p class="hint">Members’ fees and member-only windows appear after the code. Windows are shown, not held.</p><div class="acts"><button type="button" class="btn btn-p" data-act="slot-book" data-fk="slot-book">Continue with this window</button></div>' +
        (st.err ? '<p class="err" role="alert">' + st.err + '</p>' : '');
    return step('cal', 'Repair visit', 'Open arrival windows', head + days + foot, 'step-slots');
  }
  function cCode(S, c) {
    var st = S.cards.code || {};
    var body;
    if (st.stage === 'locate' && !st.done) {
      body = '<form class="stack" data-form="locate" novalidate><div class="two">' +
        '<label class="in"><span>Name on the account</span><input data-bind="code.name" data-fk="loc-name" value="' + c.esc(st.name || '') + '" autocomplete="name"></label>' +
        '<label class="in"><span>Phone</span><input data-bind="code.phone" data-fk="loc-phone" value="' + c.esc(st.phone || '') + '" inputmode="tel" autocomplete="tel"></label></div>' +
        '<div class="acts"><button class="btn btn-p" data-fk="loc-send">Send the code</button></div></form>' + (st.err ? '<p class="err" role="alert">' + st.err + '</p>' : '') +
        '<p class="hint">Demo: the dataset’s test customer. The code goes to the phone on record, never to a number typed here.</p>';
      return step('shield', 'Confirming it’s you', 'Before booking', body);
    }
    if (st.done) return evt('shield', 'Verified for this chat · phone ending 02', '2:08 pm', 'evt-log');
    body = lv('phone', 'Code sent to', 'The phone on record, ending in 02') +
      '<form class="inl" data-form="code" novalidate><label class="in in-code"><span>6-digit code</span><input id="code-input" data-fk="code-input" inputmode="numeric" autocomplete="one-time-code" maxlength="6" value="' + (st.value || '') + '"' + (st.err ? ' aria-invalid="true" aria-describedby="code-err"' : '') + '></label>' +
      '<button class="btn btn-p" data-fk="code-verify">Verify</button></form>' + (st.err ? '<p class="err" id="code-err" role="alert">' + st.err + '</p>' : '') +
      '<p class="links"><a href="#code" data-act="inbox" data-fk="inbox-link">Open the demo inbox</a></p><p class="hint">Demo: codes go to a simulated inbox, never a real phone. A code lasts 10 minutes; 3 tries.</p>';
    return step('shield', 'Confirming it’s you', 'Code sent', body);
  }
  function cConfirm(S) {
    var v = S.visit;
    return evt('check', 'Booked · ' + v.day.long + ', ' + v.win.label, '2:08 pm', 'evt-log evt-good') +
      '<div class="rows">' + lv('cal', 'Date', v.day.full + ', 2026') + lv('clock', 'Arrival window', v.win.label + ' · the technician arrives any time inside it') +
      lv('person', 'Technician', v.tech) + lv('receipt', 'Fee', '$89 diagnostic visit · ' + v.feeNote.charAt(0).toLowerCase() + v.feeNote.slice(1)) +
      lv('info', 'Changes', 'Free until ' + v.freeUntil + '. After that, a $49 late-cancellation fee applies.') + '</div>';
  }
  function cAccount() {
    var rows = [['Diagnostic visit', '$89.00'], ['Contactor replacement', '$245.00'], ['After-hours dispatch', '$144.00']];
    return '<div class="rows">' + lv('receipt', 'Invoice', 'INV-204411 · issued Oct 2, 2026') + lv('cal', 'Due', 'Nov 1, 2026') + lv('info', 'Balance', '$478.00 · unpaid') +
      '<table class="lines"><caption class="sr">Invoice lines</caption><thead><tr><th scope="col">Line</th><th scope="col">Amount</th></tr></thead><tbody>' +
      rows.map(function (r) { return '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td></tr>'; }).join('') + '</tbody><tfoot><tr><th scope="row">Total</th><td>$478.00</td></tr></tfoot></table></div>';
  }
  function byButton(S) {
    for (var i = S.items.length - 1; i >= 0 && i >= S.items.length - 3; i--) if (S.items[i].viaButton) return true;
    return false;
  }
  function cHandoff(S, c) {
    var r = S.request, st = S.cards.follow || {};
    var reason = byButton(S) ? 'You asked for a person.' : 'Billing disputes go to a person. I can’t change or remove charges.';
    var body = '<p class="reason">' + reason + '</p><p class="promise">' + c.TXT.promise + '</p><div class="lvs">' + lv('clock', 'Due', 'Mon Oct 19, 7:00 pm') + lv('receipt', 'Reference', r.ref) + '</div>';
    if (st.done) {
      body += '<div class="saved">' + ic(st.channel === 'email' ? 'mail' : 'phone') + '<p>' + (st.channel === 'email' ? 'We’ll follow up by email, at the address on your account.'
        : 'We’ll follow up by phone, at the number ending in 02, ' + { mornings: 'in the morning', afternoons: 'in the afternoon', any: 'at any time' }[st.when] + '.') + '</p>' +
        '<button type="button" class="btn btn-q btn-s" data-act="follow-change" data-fk="fu-change">Change</button></div>';
    } else {
      var radio = function (name, val, label, sub, on, act) {
        return '<label class="radio"><input type="radio" name="' + name + '" value="' + val + '" data-act="' + act + '" data-val="' + val + '" data-fk="fu-' + val + '"' + (on ? ' checked' : '') + '><span>' + label + (sub ? '<small>' + sub + '</small>' : '') + '</span></label>';
      };
      body += '<fieldset class="fu"><legend>' + c.TXT.followAsk + '</legend>' +
        radio('fu-ch', 'email', 'Email', 'the address on your account', st.channel === 'email', 'follow-ch') +
        radio('fu-ch', 'phone', 'Phone call', 'the number ending in 02', st.channel === 'phone', 'follow-ch') + '</fieldset>' +
        (st.channel === 'phone' ? '<fieldset class="fu"><legend>Best time to call</legend>' + [['mornings', 'Mornings'], ['afternoons', 'Afternoons'], ['any', 'Any time']].map(function (o) {
          return radio('fu-when', o[0], o[1], '', st.when === o[0], 'follow-when');
        }).join('') + '</fieldset>' : '') +
        '<div class="acts"><button type="button" class="btn btn-p pulse" data-act="follow-save" data-fk="fu-save">Confirm</button></div>';
    }
    return evt('receipt', 'Case ' + r.ref + ' created', '2:14 pm', 'evt-log') + step('hand', 'Passing this to a person', 'Assistant step', body, 'step-handoff');
  }
  function cQueued(S, c) {
    var joined = S.live === 'joined';
    var body = '<p class="reason">' + (byButton(S) ? 'You asked for a person.' : 'Billing disputes go to a person. I can’t change or remove charges.') + '</p>' +
      '<p class="promise">' + c.TXT.queued + '</p><div class="lvs">' + lv('receipt', 'Reference', S.request.ref) + '</div>' +
      (joined ? evt('person', 'A representative has joined this chat', '2:17 pm', 'evt-in') : evt('wait', 'Waiting for a representative · no time is promised', '', 'evt-in'));
    return evt('receipt', 'Case ' + S.request.ref + ' created', '2:14 pm', 'evt-log') + step('hand', 'Passing this to a person', 'Assistant step', body, 'step-handoff');
  }
  function card(cd, S, c) {
    switch (cd.type) {
      case 'checks': return cChecks(S, c);
      case 'question': return cQuestion(cd, S, c);
      case 'where': return cWhere(S, c);
      case 'slots': return S.cards.slots ? cSlots(S, c) : '';
      case 'confirm': return cConfirm(S, c);
      case 'code': return cCode(S, c);
      case 'account': return cAccount(S, c);
      case 'handoff': return cHandoff(S, c);
      case 'queued': return cQueued(S, c);
    }
    return '';
  }

  /* ---------- the log ---------- */
  var NAME = { assistant: 'Meridian assistant · automated', customer: 'You', rep: 'Riley · Representative (demo)' };
  function cont(it, S) {
    var i = S.items.indexOf(it), p = i > 0 ? S.items[i - 1] : null;
    return !!(p && p.kind === 'turn' && it.kind === 'turn' && p.who === it.who);
  }
  function turnHTML(who, time, html, extra, isCont) {
    var name = isCont ? '<span class="sr">' + NAME[who] + ': </span>' : '<p class="name">' + (who === 'assistant' ? '<span class="name-mk" aria-hidden="true">' + ic('chat') + '</span>' : who === 'rep' ? '<span class="name-mk name-rep" aria-hidden="true">' + ic('person') + '</span>' : '') + NAME[who] + '</p>';
    return '<div class="turn turn-' + who + (isCont ? ' is-cont' : '') + '">' + name + (html ? '<div class="blk">' + html + '</div>' : '') + (extra || '') + '<time class="t">' + time + '</time></div>';
  }
  function item(it, S, c) {
    if (it.kind === 'event') return '<div class="logevt' + (it.icon === 'person' ? ' is-join' : '') + '">' + evt(it.icon === 'pause' ? 'pause' : it.icon === 'person' ? 'person' : 'info', it.html, it.time) + '</div>';
    var extra = (it.card ? card(it.card, S, c) : '') + (it.after ? '<div class="blk">' + it.after + '</div>' : '') + (it.sources ? sources(it.sources, c) : '');
    var t = turnHTML(it.who, it.time, it.html, extra, cont(it, S));
    return it.quiet ? t.replace('class="turn turn-assistant', 'class="turn turn-assistant is-quiet') : t;
  }

  function safety(c, mode) {
    return '<section class="safety' + (mode ? ' safety-' + mode : '') + '"' + (mode ? '' : ' role="alert"') + ' aria-label="Danger: safety instruction">' +
      '<div class="sf-band">' + warnSolid() + '<p class="sf-w">DANGER</p></div><ol class="sf-list"><li><span class="sf-n" aria-hidden="true">1</span><p>' + c.TXT.safety1 + '</p></li>' +
      '<li><span class="sf-n" aria-hidden="true">2</span><p>' + c.TXT.safety2 + '</p></li></ol></section>';
  }

  /* ---------- what's settled ---------- */
  function panel(S, c, mode) {
    var h = mode === 'strip' ? '' : '<header class="pn-h"><h2>What’s settled</h2><p>Fills in as things are confirmed.</p></header>';
    if (S.safety) return h + safety(c, 'panel');
    var hl = function (k) { return S.hl === k ? ' is-hl' : ''; };
    var v = S.visit, r = S.request, out = h;

  /* ---------- prototype bar (identical in every direction file) ---------- */
  var DIRS = [
    { code: 'A1', name: 'A1 Work order', file: '2026-10-20-direction-A1-work-order.html' },
    { code: 'A2', name: 'A2 Route sheet', file: '2026-10-20-direction-A2-route-sheet.html' },
    { code: 'A3', name: "A3 Dispatcher's log", file: '2026-10-20-direction-A3-dispatchers-log.html' }
  ];
  function protoBar() {
    var links = STEPS.map(function (s, i) {
      return '<li><a href="#' + s.id + '" data-step="' + s.id + '"><span class="pj-n">' + (i + 1) + '</span><span class="pj-l">' + esc(s.label) + '</span><span class="pj-s">' + s.screen + '</span></a></li>';
    }).join('');
    return '<div class="proto-bar" role="region" aria-label="Prototype controls">' +
      '<span class="pb-name"><b>' + esc(SK.code) + '</b> <span class="pb-long">' + esc(SK.name) + ' · direction prototype</span></span>' +
      '<span class="pb-tools">' +
      '<button type="button" class="pb-btn" popovertarget="jump-menu" id="jump-btn" aria-haspopup="true">Jump to</button>' +
      DIRS.filter(function (d) { return d.code !== SK.code; }).map(function (d) {
        return '<a class="pb-btn switch-link" data-file="' + d.file + '" href="' + d.file + '#greeting" aria-label="Switch to ' + esc(d.name) + ' at this step">' + d.code + '</a>';
      }).join('') +
      '<button type="button" class="pb-btn" id="theme-btn" data-act="theme">Dark</button>' +
      '</span>' +
      '<nav id="jump-menu" popover aria-label="Jump to a step"><p class="pj-h">Scripted story · 8 steps</p><ol>' + links + '</ol>' +
      '<p class="pj-f">Synthetic demo data. Nothing is sent or booked.</p></nav>' +
      '</div>';
  }
  function syncProto(id) {
    var sws = document.querySelectorAll('.switch-link');
    for (var k = 0; k < sws.length; k++) sws[k].href = sws[k].getAttribute('data-file') + '#' + id;
    var as = document.querySelectorAll('#jump-menu a');
    for (var i = 0; i < as.length; i++) {
      if (as[i].getAttribute('data-step') === id) as[i].setAttribute('aria-current', 'step'); else as[i].removeAttribute('aria-current');
    }
  }

  /* ---------- theme ---------- */
  var dmq = window.matchMedia('(prefers-color-scheme: dark)');
  function effectiveTheme() { var t = document.documentElement.getAttribute('data-theme'); return t || (dmq.matches ? 'dark' : 'light'); }
  function syncThemeBtn() { var b = $('#theme-btn'); if (b) { var dark = effectiveTheme() === 'dark'; b.textContent = dark ? 'Light' : 'Dark'; b.setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme'); } }
  function toggleTheme() {
    var next = effectiveTheme() === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('mhc-proto-theme', next); } catch (e) { /* storage may be blocked */ }
    syncThemeBtn();
  }
  try { var saved = localStorage.getItem('mhc-proto-theme'); if (saved && !document.documentElement.getAttribute('data-theme')) document.documentElement.setAttribute('data-theme', saved); } catch (e) { /* ignore */ }

  /* ---------- toast ---------- */
  var toastTimer;
  function toast(msg) {
    var t = $('#toast'); if (!t) return;
    t.textContent = msg; t.classList.add('is-on');
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('is-on'); }, 3200);
  }

  /* ---------- events ---------- */
  document.addEventListener('click', function (e) {
    var a = e.target.closest('[data-act]');
    var jl = e.target.closest('#jump-menu a');
    if (jl) { var m = $('#jump-menu'); if (m && m.hidePopover) { try { m.hidePopover(); } catch (x) { /* closed */ } } }
    if (!a) return;
    var act = a.getAttribute('data-act'), key = a.getAttribute('data-key'), val = a.getAttribute('data-val');
    switch (act) {
      case 'theme': toggleTheme(); break;
      case 'talk': talk(); break;
      case 'choose': if (waiters[key]) resolve(key, val); break;
      case 'slot-day': S.cards.slots.day = val; S.cards.slots.win = null; S.cards.slots.err = ''; refreshCard('slots'); break;
      case 'slot-win': if (a.getAttribute('data-day')) S.cards.slots.day = a.getAttribute('data-day'); S.cards.slots.win = val; S.cards.slots.err = ''; refreshCard('slots'); break;
      case 'slot-book':
        if (!S.cards.slots.win) { S.cards.slots.err = 'Pick an arrival window first.'; refreshCard('slots'); break; }
        resolve('slots', 'pick'); break;
      case 'inbox': e.preventDefault(); openInbox(); break;
      case 'inbox-use': S.cards.code.value = CODE; S.cards.code.err = ''; closeInbox(); refreshCard('code'); var ci = $('#code-input'); if (ci) ci.focus(); break;
      case 'inbox-close': closeInbox(); break;
      case 'follow-ch': S.cards.follow.channel = val; refreshCard('follow'); break;
      case 'follow-when': S.cards.follow.when = val; refreshCard('follow'); break;
      case 'follow-save':
        if (waiters.follow) { resolve('follow', 'save'); break; }
        if (S.cards.follow) { S.cards.follow.done = true; applyFollow(); refreshCard('follow'); land('request'); toast('Follow-up choice updated.'); }
        break;
      case 'follow-change': if (S.cards.follow) { S.cards.follow.done = false; refreshCard('follow'); } break;
      case 'demo-join': if (waiters.join) resolve('join', 'join'); break;
      case 'stub': toast(a.getAttribute('data-msg') || 'Not part of this direction prototype.'); break;
      case 'case-select': CS.sel = val; CS.callOpen = CS.flagOpen = false; renderCase('q-' + val); break;
      case 'case-tab': CS.tab = val; renderCase('tab-' + val); break;
      case 'src-jump': CS.tab = 'sources'; CS.hl = val; renderCase(); var s = document.getElementById('src-' + val); if (s) { s.scrollIntoView({ block: 'nearest', behavior: calm() ? 'auto' : 'smooth' }); s.focus({ preventScroll: true }); }
        if (!calm()) setTimeout(function () { if (CS.hl === val) { CS.hl = null; var x = document.getElementById('src-' + val); if (x) x.classList.remove('is-hl'); } }, 1800); else CS.hl = null;
        break;
      case 'case-claim': CS.claimed = true; CS.acts.push({ time: 'Fri 2:20 pm', text: 'Claimed by Riley (demo representative).' }); renderCase('act-call'); break;
      case 'case-call': CS.callOpen = !CS.callOpen; CS.flagOpen = false; renderCase(CS.callOpen ? 'call-outcome' : 'act-call'); break;
      case 'case-flag': CS.flagOpen = !CS.flagOpen; CS.callOpen = false; renderCase(CS.flagOpen ? 'flag-reason' : 'act-flag'); break;
      case 'case-join': toast('Join chat works only while the customer is in a live chat.'); break;
    }
  });
  document.addEventListener('input', function (e) {
    if (e.target.id === 'code-input' && S.cards.code) { S.cards.code.value = e.target.value.replace(/\D/g, '').slice(0, 6); }
    var bind = e.target.getAttribute && e.target.getAttribute('data-bind');
    if (bind) { var bp = bind.split('.'); if (S.cards[bp[0]]) S.cards[bp[0]][bp[1]] = e.target.value; }
  });
  document.addEventListener('submit', function (e) {
    var f = e.target, kind = f.getAttribute('data-form');
    if (!kind) return;
    e.preventDefault();
    if (kind === 'composer') { var v = ($('#composer-input').value || '').trim(); advance(v); return; }
    if (kind === 'where') {
      var wv = (S.cards.where.value || '').trim();
      if (!/^(78640|kyle)\b/i.test(wv)) { S.cards.where.err = 'This scripted demo covers Kyle (78640). Try that ZIP.'; refreshCard('where'); var wi = $('#where-input'); if (wi) wi.focus(); return; }
      S.cards.where.err = ''; resolve('where', 'ok'); return;
    }
    if (kind === 'locate') {
      var lc = S.cards.code;
      if (!(lc.name || '').trim() || !(lc.phone || '').trim()) { lc.err = 'Enter the name and phone on the account.'; refreshCard('code'); return; }
      lc.err = ''; lc.stage = 'sent'; S.identity = 'sent'; land('identity'); refreshCard('code');
      var cin = $('#code-input'); if (cin) cin.focus();
      return;
    }
    if (kind === 'code') {
      var c = S.cards.code;
      if (c.done) return;
      if (c.value === CODE) { c.err = ''; resolve('code', 'ok'); return; }
      c.attempts = (c.attempts || 0) + 1;
      c.err = c.attempts >= 3 ? 'No tries left. In the product this goes to a person, and nothing about the account is shown (FLOW-3).'
        : (c.value.length !== 6 ? 'Enter all 6 digits.' : "That code doesn't match. " + (3 - c.attempts) + (3 - c.attempts === 1 ? ' try' : ' tries') + ' left.');
      refreshCard('code');
      var ci = $('#code-input'); if (ci) ci.focus();
      return;
    }
    if (kind === 'call') {
      var out = f.querySelector('[name=outcome]:checked');
      CS.acts.push({ time: 'Fri 2:22 pm', text: 'Call logged: ' + (out ? out.value : 'No answer') + '. Demo: recorded, not sent.' });
      CS.callOpen = false; renderCase('act-call'); return;
    }
    if (kind === 'flag') {
      var r = f.querySelector('select'); CS.flagged = r ? r.value : 'Other';
      CS.acts.push({ time: 'Fri 2:23 pm', text: 'Flagged for review: ' + CS.flagged + '.' });
      CS.flagOpen = false; renderCase('act-flag'); return;
    }
  });
  document.addEventListener('keydown', function (e) {
    var appEl = $('#app');
    if (appEl && appEl.getAttribute('data-view') === 'case') {
      var row = e.target.closest && e.target.closest('[data-queue] [data-ref]');
      if (!row) return;
      var rows = Array.prototype.slice.call(document.querySelectorAll('[data-queue] [data-ref]'));
      var i = rows.indexOf(row);
      if (e.key === 'j' || e.key === 'ArrowDown') { e.preventDefault(); if (rows[i + 1]) rows[i + 1].focus(); }
      if (e.key === 'k' || e.key === 'ArrowUp') { e.preventDefault(); if (rows[i - 1]) rows[i - 1].focus(); }
    }
  });

  /* demo inbox (stub of SCR-2) */
  function openInbox() {
    var d = $('#inbox');
    if (!d) { document.body.insertAdjacentHTML('beforeend', SK.inbox(ctx)); d = $('#inbox'); }
    if (d.showModal) d.showModal(); else d.setAttribute('open', '');
  }
  function closeInbox() { var d = $('#inbox'); if (d && d.close) d.close(); }

  /* ---------- boot ---------- */
  function boot() {
    document.body.insertAdjacentHTML('afterbegin', protoBar());
    if (!$('#app')) document.body.insertAdjacentHTML('beforeend', '<div id="app"></div>');
    if (!$('#toast')) document.body.insertAdjacentHTML('beforeend', '<div id="toast" role="status" aria-live="polite"></div>');
    syncThemeBtn();
    dmq.addEventListener && dmq.addEventListener('change', syncThemeBtn);
    window.addEventListener('hashchange', function () { goTo(location.hash.slice(1)); });
    goTo(location.hash.slice(1) || 'greeting');
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
</body>
