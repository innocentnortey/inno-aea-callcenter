/* Prototype chrome (not product UI): identical in every direction file. */
[hidden] { display: none !important; }
.proto-bar { position: sticky; top: 0; z-index: 40; height: 40px; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 8px 0 14px; background: #262A31; color: #F1F3F6; font: 500 13px/1.2 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
.pb-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.pb-name b { font-weight: 700; margin-right: 2px; }
.pb-tools { display: flex; gap: 4px; flex: none; }
.pb-btn { display: inline-flex; align-items: center; min-height: 32px; padding: 0 10px; border-radius: 4px; background: #3A404A; color: #F1F3F6; border: 0; font: inherit; text-decoration: none; cursor: pointer; white-space: nowrap; }
.pb-btn:hover { background: #4A515D; }
.proto-bar :focus-visible, #jump-menu :focus-visible { outline: 2px solid #A9C6FF; outline-offset: 1px; }
@media (max-width: 560px) { .pb-long { display: none; } }
#jump-menu { position: fixed; inset: 44px 8px auto auto; margin: 0; width: min(360px, calc(100vw - 16px)); padding: 6px; border: 0; border-radius: 6px; background: #262A31; color: #F1F3F6; box-shadow: 0 18px 44px -14px rgba(0, 0, 0, .6); font: 500 13px/1.3 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
#jump-menu ol { list-style: none; margin: 0; padding: 0; }
#jump-menu a { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: center; min-height: 40px; padding: 6px 8px; border-radius: 4px; color: inherit; text-decoration: none; }
#jump-menu a:hover, #jump-menu a[aria-current] { background: #3A404A; }
#jump-menu a[aria-current] .pj-l { font-weight: 700; }
.pj-n { font-variant-numeric: tabular-nums; color: #BAC1CD; }
.pj-s, .pj-h, .pj-f { font-size: 12px; color: #BAC1CD; }
.pj-h, .pj-f { margin: 6px 8px; }

/* A5 · Service desk. Cool blue-grey canvas framing white surfaces, hairline cards with tinted header rows, mint customer turns,
   grey assistant turns, emerald action, charcoal Send. Light first. Instrument Sans (headings) + Inter (body) + Geist Mono (refs). */
:root {
  color-scheme: light dark;
  --display: "A5 Display", "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --sans: "A5 Sans", Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "A5 Mono", "Geist Mono", ui-monospace, Menlo, monospace;
  --ground: #E5E9F0; --panel: #FFFFFF; --rail: #F5F6F7; --well: #F3F5F7; --selected: #E5E9F0;
  --hair: #E3E7EB; --mint: #E2F8EF; --mint-edge: #B4EDD5;
  --ink: #101216; --ink2: #5B656D; --primary: #007847; --on-primary: #FFFFFF; --signal: #00BC6F;
  --charcoal: #202629; --on-charcoal: #FFFFFF; --person: #2A2663; --on-person: #FFFFFF;
  --danger: #B42318; --on-danger: #FFFFFF; --line: #7F8A91; --focus: #007847;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ground: #0B0F12; --panel: #151A1E; --rail: #11161A; --well: #20272C; --selected: #2A3238;
--hair: #2C343A; --mint: #0F3326; --mint-edge: #17513C;
--ink: #E9EDF0; --ink2: #A7B1B9; --primary: #00BC6F; --on-primary: #03140C; --signal: #00BC6F;
--charcoal: #DDE3E8; --on-charcoal: #101216; --person: #A9A4F0; --on-person: #14123A;
--danger: #C8312F; --on-danger: #FFFFFF; --line: #6B767E; --focus: #00BC6F; } }
:root[data-theme="dark"] { --ground: #0B0F12; --panel: #151A1E; --rail: #11161A; --well: #20272C; --selected: #2A3238;
--hair: #2C343A; --mint: #0F3326; --mint-edge: #17513C;
--ink: #E9EDF0; --ink2: #A7B1B9; --primary: #00BC6F; --on-primary: #03140C; --signal: #00BC6F;
--charcoal: #DDE3E8; --on-charcoal: #101216; --person: #A9A4F0; --on-person: #14123A;
--danger: #C8312F; --on-danger: #FFFFFF; --line: #6B767E; --focus: #00BC6F; }
:root[data-theme="light"] { color-scheme: light; } :root[data-theme="dark"] { color-scheme: dark; }


* { box-sizing: border-box; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 400 .9375rem/1.5 var(--sans); font-feature-settings: "cv11"; -webkit-font-smoothing: antialiased; }
#app { height: calc(100dvh - 40px); }
button, input, select { font: inherit; color: inherit; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic[viewBox="0 0 20 20"] { stroke-width: 1.5; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
time, .row-v, .win, .daytab, .lines, .snap, .qrow, .chip, .mono, .big, .tag, .ptag { font-variant-numeric: tabular-nums; }
h1, h2, h3, h4 { text-wrap: balance; font-family: var(--display); font-stretch: 96%; }
p { text-wrap: pretty; }
q, blockquote, em, i { font-style: normal; }
.mono { font-family: var(--mono); font-size: .92em; white-space: nowrap; }
.pb-btn[aria-pressed="true"] { background: #E9EDF0; color: #262A31; }

/* chat frame */
.chat { height: 100%; display: flex; flex-direction: column; background: var(--panel); overflow: hidden; }
@media (min-width: 760px) { #app { padding: 12px; } .chat { border-radius: 24px; box-shadow: 0 0 0 1px var(--hair); } }
.ch-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; background: var(--panel); border-bottom: 1px solid var(--hair); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-t { min-width: 0; }
.brand-n { margin: 0; font: 600 1rem/1.3 var(--display); font-stretch: 96%; }
.brand-s { margin: 0; font-size: .78rem; color: var(--ink2); overflow-wrap: anywhere; }
.link-b { background: none; border: 0; color: var(--primary); text-decoration: underline; font-weight: 600; min-height: 44px; padding: 0 8px; cursor: pointer; flex: none; }
.mark { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 7px; background: var(--mint); color: var(--primary); flex: none; box-shadow: inset 0 0 0 1px var(--mint-edge); }
.mark .ic { width: 16px; height: 16px; }
.ch-head .mark { width: 30px; height: 30px; border-radius: 8px; }
.ch-head .mark .ic { width: 20px; height: 20px; }
.name .mark { width: 18px; height: 18px; border-radius: 5px; }
.name .mark .ic { width: 12px; height: 12px; }
.demo-bar { display: flex; flex-wrap: wrap; justify-content: center; gap: 0 6px; padding: 6px 12px; background: var(--well); color: var(--ink2); font-size: .75rem; }
.chip { background: none; padding: 0; }
.demo-bar .chip + .chip::before { content: "·"; margin-right: 6px; }
.demo-bar-inline { font-size: .75rem; color: var(--ink2); }
.banner { background: var(--rail); border-bottom: 1px solid var(--hair); padding: 8px 14px; font-size: .875rem; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.banner p { margin: 0; display: flex; gap: 8px; align-items: center; }
.strip { border-bottom: 1px solid var(--hair); background: var(--panel); }
.strip > summary { min-height: 48px; padding: 8px 40px 8px 14px; list-style: none; cursor: pointer; position: relative; display: flex; gap: 10px; align-items: center; font-size: .8125rem; }
.strip > summary::-webkit-details-marker { display: none; }
.strip > summary::after { content: ""; position: absolute; right: 18px; top: 50%; width: 8px; height: 8px; margin-top: -6px; border-right: 2px solid var(--ink2); border-bottom: 2px solid var(--ink2); transform: rotate(45deg); }
.strip[open] > summary::after { transform: rotate(-135deg); margin-top: -2px; }
.st-l { font: 600 .875rem var(--display); white-space: nowrap; }
.st-b { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; min-width: 0; }
.st-b .ic { width: 15px; height: 15px; color: var(--ink2); }
.st-b > span { display: inline-flex; align-items: center; gap: 4px; }
.strip-b { padding: 0 12px 12px; max-height: 52vh; overflow-y: auto; }
.strip.is-safety { display: none; }
.ch-main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr); }
.ch-col { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.panel { display: none; }
@media (min-width: 1024px) {
  .ch-main { grid-template-columns: minmax(0, 1fr) 360px; }
  .panel { display: block; overflow-y: auto; padding: 16px; background: var(--rail); border-left: 1px solid var(--hair); }
  .strip { display: none; }
}
.thread { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding: 16px 14px 20px; background: var(--panel); }
.thread > * { max-width: 640px; }
.pinned { flex: none; padding: 0; }

/* conversation */
.day-div { display: flex; align-items: center; gap: 12px; margin: 0; font-size: .75rem; color: var(--ink2); }
.day-div::before, .day-div::after { content: ""; flex: 1; height: 1px; background: var(--hair); }
.turn { display: flex; flex-direction: column; align-items: flex-start; gap: 5px; width: 100%; min-width: 0; }
.turn-customer { align-items: flex-end; }
.name { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 0; font-size: .75rem; color: var(--ink2); }
.turn-customer .name { justify-content: flex-end; }

.blk { max-width: 62ch; padding: 10px 12px; overflow-wrap: anywhere; }
.turn-assistant .blk, .turn-rep .blk { background: var(--well); border-radius: 4px 12px 12px 12px; }
.turn-customer .blk { background: var(--mint); border-radius: 12px 4px 12px 12px; }

.blk b { font-weight: 600; }
.disc { width: 24px; height: 24px; border-radius: 50%; background: var(--person); color: var(--on-person); display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: .72rem; flex: none; }
.is-quiet .blk { background: transparent; padding-left: 0; color: var(--ink2); font-size: .875rem; }
.logevt { display: flex; }
.logevt .evt { width: 100%; justify-content: center; color: var(--ink2); font-size: .8125rem; }
.logevt .evt::before, .logevt .evt::after { content: ""; flex: 1; height: 1px; background: var(--hair); }
.evt { display: flex; align-items: center; gap: 8px; margin: 8px 0 0; font-size: .875rem; }
.evt .ic { width: 16px; height: 16px; color: var(--primary); }
.logevt .evt .ic { color: var(--ink2); }
.evt time { color: var(--ink2); font-size: .75rem; }
.evt-status .ic { color: var(--ink); }
.logevt.pending .evt { color: var(--ink2); font-size: .875rem; }
.thread-mini .logevt .evt { margin: 0; }

/* cards and controls */
.acard { background: var(--panel); border: 1px solid var(--hair); border-radius: 12px; overflow: hidden; margin: 2px 0; max-width: 100%; }
.cardhead { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; padding: 9px 12px; background: var(--rail); border-bottom: 1px solid var(--hair); font-size: .875rem; }
.cardhead .ic { color: var(--primary); }

.cardmeta { min-width: 0; overflow-wrap: anywhere; margin-left: auto; color: var(--ink2); font-size: .8125rem; display: inline-flex; align-items: center; gap: 6px; text-align: right; }
.cardbody { padding: 4px 12px 12px; min-width: 0; }
.rows { margin: 0; }

.tag { display: inline-flex; align-items: center; gap: 4px; background: var(--well); color: var(--ink); border-radius: 6px; padding: 2px 7px; font-size: .78rem; font-weight: 600; }

.tag-strong { background: var(--selected); box-shadow: inset 0 0 0 1px var(--ink2); }
.promise { font: 600 1.125rem/1.35 var(--display); font-stretch: 96%; margin: 8px 0 6px; }
.reason { margin: 6px 0 0; color: var(--ink2); }
.btn { min-height: 44px; padding: 0 18px; border-radius: 8px; border: 1px solid transparent; font-weight: 600; font-size: .9375rem; cursor: pointer; }
.btn-p { background: var(--primary); color: var(--on-primary); }
.btn-q { background: var(--panel); border-color: var(--hair); color: var(--ink); }

.btn-s { min-height: 44px; font-size: .875rem; }

.acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.in { display: flex; flex-direction: column; gap: 4px; font-size: .8125rem; color: var(--ink2); min-width: 0; flex: 1; }
.in input, select { min-height: 46px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); min-width: 0; width: 100%; }

.in-code input { letter-spacing: .3em; font-size: 1.25rem; font-variant-numeric: tabular-nums; }
.inl { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; margin-top: 8px; }
.stack { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
.two { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
@media (min-width: 480px) { .two { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.err { margin: 10px 0 0; font-weight: 600; }

.links { margin: 8px 0 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; font-size: .875rem; }
.links a { color: var(--primary); font-weight: 600; display: inline-flex; align-items: center; min-height: 44px; }
.linkbtn { background: none; border: 0; color: var(--primary); font-weight: 600; text-decoration: underline; min-height: 44px; padding: 0 4px; cursor: pointer; font-size: .875rem; }
.checks { margin: 8px 0 0; padding-left: 20px; font-size: .875rem; }

.q-t { margin: 8px 0 0; font-size: .9375rem; }
.fu { border: 0; margin: 12px 0 0; padding: 0; min-width: 0; }

.fu .radio { display: flex; align-items: flex-start; gap: 10px; min-height: 44px; padding: 9px 10px; margin-bottom: 6px; border: 1px solid var(--hair); border-radius: 8px; background: var(--panel); cursor: pointer; }

.saved { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: var(--mint); border: 1px solid var(--mint-edge); }
.saved .ic { color: var(--primary); }

.lines { width: 100%; margin: 6px 0 4px; border-collapse: collapse; font-size: .875rem; }
.lines th, .lines td { padding: 6px 0; text-align: left; font-weight: 400; }
.lines td:last-child, .lines thead th:last-child { text-align: right; }

.lines tfoot th, .lines tfoot td { font-weight: 700; padding-top: 10px; border-top: 1px solid var(--hair); }
.next-h { margin: 12px 0 4px; font-size: .875rem; }
.next { list-style: none; margin: 0; padding: 0; font-size: .875rem; }

.next .ic { color: var(--primary); margin-top: 2px; }

/* day tabs and windows */
.daytabs { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); border-bottom: 1px solid var(--hair); margin: 0 -12px; padding: 0 12px; }
.daytab { min-height: 48px; background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; color: var(--ink2); font-size: .8125rem; cursor: pointer; padding: 6px 0; }

.daytab[aria-pressed="true"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--primary); }
.daytab[aria-pressed="true"] b { font-weight: 700; }
.daytab:disabled { cursor: default; }
.wins { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; margin: 10px 0 0; }
.win { min-height: 44px; border: 1px solid var(--hair); border-radius: 8px; background: var(--panel); font-size: .84rem; padding: 6px; display: flex; align-items: center; justify-content: center; gap: 4px; flex-wrap: wrap; cursor: pointer; }
.win.is-sel { background: var(--mint); border: 2px solid var(--primary); font-weight: 600; padding: 5px; }
.win.is-sel .ic { color: var(--primary); width: 16px; height: 16px; }
.win.is-taken { background: var(--well); border-color: var(--well); color: var(--ink2); cursor: not-allowed; }
.win.is-taken s { text-decoration-thickness: 1px; }
.win.is-taken i { flex-basis: 100%; font-style: normal; font-size: .75rem; font-weight: 600; text-align: center; }
.win:disabled:not(.is-taken):not(.is-sel) { opacity: .6; }

/* sources */
.srcs { display: flex; flex-wrap: wrap; gap: 6px; }
.src { max-width: 100%; }
.src > summary { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; min-height: 44px; padding: 4px 10px; border-radius: 6px; background: var(--well); font-size: .8125rem; cursor: pointer; list-style: none; max-width: 100%; overflow-wrap: anywhere; }
.src > summary::-webkit-details-marker { display: none; }
.src > summary .ic { width: 15px; height: 15px; color: var(--ink2); }
.src[open] > summary { background: var(--mint); }
.src-v { color: var(--ink2); }
.src[open] .src-v { color: var(--ink); }
.src-b { margin-top: 6px; padding: 10px 12px; border: 1px solid var(--hair); border-radius: 8px; background: var(--panel); font-size: .875rem; max-width: 62ch; }
.src-b p { margin: 6px 0 0; color: var(--ink2); }

/* safety: the only red, the only square object */
.safety { background: var(--panel); color: var(--ink); border-radius: 0; border: 0; border-bottom: 4px solid var(--danger); }
.sf-band { display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--danger); color: var(--on-danger); }
.sf-w { margin: 0; font: 700 .9375rem var(--display); letter-spacing: .1em; }
.sf-list { margin: 14px 0 4px; padding: 0 16px 0 40px; font: 600 1.25rem/1.35 var(--display); font-stretch: 96%; list-style: decimal; }
.sf-list li { margin-bottom: 4px; }
.sf-p { margin: 8px 0 0; padding: 0 16px 16px; font-size: .9375rem; }
.safety-panel { margin-top: 0; }
.ic-warn { width: 24px; height: 24px; color: var(--on-danger); flex: none; }
#app[data-safety] .thread > :not(:last-child) { opacity: .45; filter: grayscale(1); }

/* composer */
.composer { flex: none; padding: 8px 12px 14px; background: var(--panel); border-top: 1px solid var(--hair); }
.cp-top { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin-bottom: 8px; }
.talk { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px; background: var(--panel); border: 1px solid var(--hair); border-radius: 8px; font-weight: 600; font-size: .875rem; cursor: pointer; }
.talk:hover { background: var(--well); }
.talk .ic { color: var(--primary); }
.cp-hint { font-size: .75rem; color: var(--ink2); }
.cp-well { display: flex; align-items: center; gap: 8px; min-height: 56px; padding: 6px 6px 6px 12px; background: var(--well); border-radius: 10px; box-shadow: inset 0 0 0 1px var(--line); }
.cp-well input { flex: 1; min-width: 0; min-height: 44px; border: 0; background: transparent; outline-offset: 4px; }
.send { min-height: 44px; min-width: 64px; padding: 0 16px; border: 0; border-radius: 7px; background: var(--charcoal); color: var(--on-charcoal); font-weight: 600; cursor: pointer; }

/* what's settled */
.pn-h h2 { margin: 0 0 2px; font: 600 1.1875rem var(--display); font-stretch: 96%; }
.pn-h p { margin: 0 0 12px; color: var(--ink2); font-size: .875rem; }
.pn-s { margin-bottom: 12px; }
.pn-s .cardbody p { margin: 8px 0 0; font-size: .875rem; }
.pn-s.is-empty .cardbody p { color: var(--ink2); }
.strip-b .pn-s { background: var(--panel); }
@keyframes a5-wash { from { background-color: var(--mint); } }

/* staff console (S2) */
.console { min-height: 100%; display: flex; flex-direction: column; }
.cs-head { border-bottom: 0; background: transparent; }
.case-root { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.cs-frame { background: var(--panel); }
.cs-grid { display: grid; grid-template-columns: minmax(0, 1fr); background: var(--panel); }
.cs-main { min-width: 0; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr); }
.brief, .evidence { min-width: 0; padding: 14px 16px; }
.evidence { border-top: 1px solid var(--hair); }
.q-col { background: var(--rail); border-bottom: 1px solid var(--hair); }
.q-sum { min-height: 48px; padding: 0 14px; display: flex; align-items: center; gap: 10px; font-weight: 600; cursor: pointer; }
.q-in { padding: 0 10px 12px; }
@media (min-width: 760px) { .cs-frame { border-radius: 24px; overflow: hidden; box-shadow: 0 0 0 1px var(--hair); margin: 0 12px 12px; } }
@media (min-width: 900px) { .cols { grid-template-columns: minmax(0, 1fr) 300px; } .evidence { border-top: 0; border-left: 1px solid var(--hair); } }
@media (min-width: 1100px) {
  #app[data-view="case"] { height: calc(100dvh - 40px); }
  #app[data-view="case"] .console { height: 100%; }
  .cs-frame { flex: 1; min-height: 0; }
  .cs-grid { height: 100%; grid-template-columns: 280px minmax(0, 1fr); }
  .q-col { border-bottom: 0; border-right: 1px solid var(--hair); overflow-y: auto; }
  .q-sum { display: none; }
  .cs-main { display: flex; flex-direction: column; min-height: 0; }
  .cols { flex: 1; min-height: 0; grid-template-columns: minmax(0, 1fr) 340px; }
  .brief, .evidence { overflow-y: auto; min-height: 0; }
}
@media (max-width: 1099px) { #app[data-view="case"] { height: auto; min-height: calc(100dvh - 40px); } }
.who { display: flex; gap: 10px; align-items: center; padding: 0 6px 12px; border-bottom: 1px solid var(--hair); margin-bottom: 6px; }
.who > div { display: flex; flex-direction: column; line-height: 1.25; }
.who small { color: var(--ink2); font-size: .75rem; }
.who .disc { width: 32px; height: 32px; font-size: .8125rem; }
.q-g { font: 600 .75rem var(--sans); text-transform: uppercase; letter-spacing: .06em; color: var(--ink2); margin: 12px 6px 6px; }
.qlist { list-style: none; margin: 0; padding: 0; }
.qrow { width: 100%; text-align: left; background: transparent; border: 0; display: grid; gap: 3px; padding: 9px 8px; border-radius: 8px; min-height: 56px; cursor: pointer; margin-bottom: 2px; }
.qrow:hover { background: var(--well); }
.qrow.is-sel { background: var(--selected); }
.qr-1 { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.qr-n { font-weight: 600; font-size: .875rem; }
.qr-d { color: var(--ink2); font-size: .78rem; overflow-wrap: anywhere; }
.ptag { display: inline-flex; align-items: center; gap: 4px; background: var(--well); color: var(--ink); border-radius: 6px; padding: 1px 6px; font-size: .75rem; font-weight: 600; white-space: nowrap; flex: none; }
.ptag .ic { width: 13px; height: 13px; }
.qrow.is-sel .ptag { background: var(--panel); }
.ptag-strong { background: var(--selected); box-shadow: inset 0 0 0 1px var(--ink2); }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--hair); }
.bar .mono { font-weight: 600; font-size: .9375rem; }
.titlepill { background: var(--well); border-radius: 6px; padding: 3px 9px; font-weight: 500; font-size: .875rem; }
.split { display: inline-flex; margin-left: auto; border-radius: 8px; background: var(--primary); color: var(--on-primary); overflow: hidden; }
.split-m, .split-c { background: transparent; color: var(--on-primary); border: 0; min-height: 40px; font-weight: 600; cursor: pointer; }
.split-m { padding: 0 16px; }
.split-c { padding: 0 9px; border-left: 1px solid var(--on-primary); display: inline-flex; align-items: center; }
.split-c .ic { stroke: var(--on-primary); }
.tabrow { display: flex; gap: 22px; border-bottom: 1px solid var(--hair); margin-top: 8px; }
.tabrow [role="tab"], .brief-h { min-height: 40px; background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; color: var(--ink2); font-weight: 500; cursor: pointer; padding: 0; }
.tabrow [aria-selected="true"], .brief-h { color: var(--ink); font-weight: 600; border-bottom-color: var(--primary); }
.brief-h { display: inline-block; margin: 0 0 12px; font: 600 .9375rem/40px var(--sans); cursor: default; border-bottom: 2px solid var(--primary); }
.col-h h2 { margin: 0; font: 600 1rem var(--display); font-stretch: 96%; }
.col-h p { margin: 0; color: var(--ink2); font-size: .8125rem; }
.draft { background: linear-gradient(135deg, var(--mint-edge) 0%, var(--mint) 22%, var(--mint) 100%); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; }
.dhead { display: flex; gap: 6px; align-items: center; font-size: .8125rem; margin-bottom: 4px; color: var(--ink); }
.dhead .ic { color: var(--primary); }
.draft .row { border-bottom-color: var(--mint-edge); }
.big { font: 600 1.0625rem/1.4 var(--display); font-stretch: 96%; margin: 2px 0 6px; color: var(--ink); }
.bsec { border: 1px solid var(--hair); border-radius: 12px; padding: 10px 14px; background: var(--panel); margin-bottom: 10px; }
.bsec > summary { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: .875rem; cursor: pointer; min-height: 32px; }
.bs-n { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 6px; background: var(--well); font-size: .75rem; font-weight: 600; flex: none; }
.bsec ul { margin: 6px 0 0; padding-left: 0; list-style: none; font-size: .875rem; }
.bsec li { display: flex; gap: 8px; margin-bottom: 6px; }
.bsec li .ic { margin-top: 2px; color: var(--ink2); }
.lbl { display: flex; align-items: center; gap: 5px; margin: 0 0 4px; font-size: .78rem; color: var(--ink2); }
.claims { background: var(--well); border-radius: 8px; padding: 8px 12px; margin-top: 8px; }
.claims ul { margin: 0; }
.srcchip { display: inline-flex; align-items: center; gap: 4px; min-height: 28px; padding: 2px 8px; border-radius: 6px; background: var(--well); border: 0; font-size: .75rem; cursor: pointer; margin: 2px 0; }
.srcchip:hover { background: var(--mint); }
.srcchip .ic { width: 13px; height: 13px; }
.cacts { margin-top: 12px; }
.cbtn { min-height: 40px; padding: 0 12px; border-radius: 8px; background: var(--panel); border: 1px solid var(--hair); font-weight: 600; font-size: .875rem; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.cbtn:hover { background: var(--well); }
.cbtn-p { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.cbtn:disabled { opacity: .5; cursor: not-allowed; }
.mini { margin-top: 10px; padding: 10px; background: var(--well); border-radius: 8px; }
.activity { margin-top: 8px; }
.src-card { margin-bottom: 10px; }
.src-card.is-hl { background: var(--mint); box-shadow: 0 0 0 2px var(--primary); }
.src-card .cardbody { padding-top: 8px; }
.src-meta { margin: 0 0 8px; font-size: .8125rem; color: var(--ink2); overflow-wrap: anywhere; }
.snap { width: 100%; border-collapse: collapse; font-size: .8125rem; }
.snap th, .snap td { padding: 6px 6px 6px 0; text-align: left; vertical-align: top; }
.snap thead th { font-weight: 600; }
.snap small { display: block; font-weight: 400; color: var(--ink2); }
.snap tbody th { font-weight: 400; color: var(--ink2); }
.snap tbody tr:nth-child(odd) { background: var(--well); }
.quote { margin: 0 0 8px; padding: 10px 12px; border-radius: 8px; background: var(--well); font-size: .875rem; }
.fact { display: flex; flex-direction: column; gap: 2px; margin: 8px 0 0; font-weight: 600; font-size: .875rem; }
.fact span { font-size: .75rem; color: var(--ink2); font-weight: 500; }
.ev-p { padding-top: 12px; }
.thread-mini { padding: 0; gap: 12px; overflow: visible; background: transparent; }
.thread-mini .blk { background: transparent; padding: 0; }
.thread-mini .turn-customer { align-items: flex-start; }
.thread-mini .turn-customer .name { justify-content: flex-start; }
.note { background: var(--well); border: 1px dashed var(--ink2); border-radius: 8px; padding: 10px 12px; }
.note p { margin: 0; font-size: .875rem; }
.note-h { display: flex; align-items: center; gap: 6px; font-weight: 600; margin-bottom: 4px !important; }
.note time { color: var(--ink2); font-size: .75rem; }

/* dialog and toast */
.inbox { background: var(--panel); color: var(--ink); border: 1px solid var(--hair); border-radius: 12px; padding: 18px; max-width: min(440px, calc(100vw - 24px)); }
.inbox::backdrop { background: rgba(11, 15, 18, .5); }
.inbox h2 { margin: 0 0 6px; font-size: 1.125rem; }
.inbox-m { background: var(--well); border-radius: 8px; padding: 10px 12px; margin-top: 10px; }
.inbox-m p { margin: 0 0 4px; }
.inbox-m .t { font-size: .75rem; color: var(--ink2); }
#toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); max-width: min(520px, calc(100vw - 24px)); background: var(--charcoal); color: var(--on-charcoal); border-radius: 8px; padding: 10px 16px; font-size: .875rem; opacity: 0; pointer-events: none; z-index: 60; }
#toast.is-on { opacity: 1; }

@media (max-width: 480px) { .thread { padding: 14px 10px 16px; } .ch-head, .composer { padding-left: 10px; padding-right: 10px; } .brief, .evidence { padding: 12px; } }

/* motion (opt-in only) */
@keyframes a5-in { from { opacity: 0; transform: translateY(4px); } }
@keyframes a5-draw { from { stroke-dashoffset: 20; } to { stroke-dashoffset: 0; } }
@keyframes a5-fade { from { opacity: 0; } }
@media (prefers-reduced-motion: no-preference) {
  .is-arriving { animation: a5-in .22s ease-out both; }
  .is-hl > .cardhead { animation: a5-wash .4s ease-out; }
  .win.is-sel .ic path { stroke-dasharray: 20; animation: a5-draw .16s ease-out; }
  .logevt.is-join.is-arriving { animation: a5-fade .3s ease-out both; }
  .btn, .win, .qrow, .cbtn, .talk { transition: background-color .15s ease-out, color .15s ease-out; }
  #toast { transition: opacity .2s; }
}

</style>
</head>
<body>
<noscript><p style="padding:16px">This direction prototype needs JavaScript to play its scripted story.</p></noscript>
<div id="app"></div>
<script>
/* A5 · Service desk: markup construction. Hairline cards with a tinted header row and an emerald icon, a name line over every
   message (mint for the customer, grey for the assistant), day tabs and window tiles for booking, a square red safety card.
   Read by the shared engine as window.SKIN. */
(function () {
  'use strict';
  var I = {
    person: '<circle cx="10" cy="7" r="3"/><path d="M4.5 16.5c.7-2.9 2.9-4.5 5.5-4.5s4.8 1.6 5.5 4.5"/>',

    info: '<circle cx="10" cy="10" r="6.5"/><path d="M10 9v4.5M10 6.6v.1"/>',
    shield: '<path d="M10 3.5 15.5 5.5v4.2c0 3.2-2.3 5.8-5.5 6.8-3.2-1-5.5-3.6-5.5-6.8V5.5z"/><path d="m7.6 10 1.7 1.7 3.2-3.2"/>',
    tool: '<path d="M12.5 4a3.5 3.5 0 0 0-3.3 4.6L4 13.8 6.2 16l5.2-5.2A3.5 3.5 0 0 0 16 7.5l-2 2-2-.5-.5-2 2-2a3.5 3.5 0 0 0-1-.5Z"/>',
    phone: '<path d="M6 3.5h2.5l1 3.5-1.7 1.2a8 8 0 0 0 4 4l1.2-1.7 3.5 1v2.5a1.5 1.5 0 0 1-1.6 1.5C9 15.2 4.8 11 4.5 5.1A1.5 1.5 0 0 1 6 3.5Z"/>',
    mail: '<rect x="3.5" y="5" width="13" height="10" rx="2"/><path d="m4 5.5 6 5 6-5"/>',
    lock: '<rect x="5" y="9" width="10" height="7.5" rx="2"/><path d="M7.5 9V7a2.5 2.5 0 0 1 5 0v2"/>',
    flag: '<path d="M5.5 16.5V4M5.5 4.5h8l-1.6 3 1.6 3h-8"/>',
    pause: '<circle cx="10" cy="10" r="6.5"/><path d="M8.5 7.5v5M11.5 7.5v5"/>',
    wait: '<path d="M6.5 3.5h7M6.5 16.5h7M7 3.5c0 3.5 6 3.5 6 6.5s-6 3-6 6.5M13 3.5c0 3.5-6 3.5-6 6.5"/>',
    question: '<circle cx="10" cy="10" r="6.5"/><path d="M8.2 8.2a1.9 1.9 0 1 1 2.6 1.8c-.5.2-.8.6-.8 1.2v.3M10 13.8v.1"/>',
    chat: '<path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h9A1.5 1.5 0 0 1 16 5.5v6a1.5 1.5 0 0 1-1.5 1.5H9l-3.5 3v-3h0A1.5 1.5 0 0 1 4 11.5z"/>'
  };
  var I24 = {
    head: '<path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/>',
    cal: '<rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
    clock: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
    ticket: '<path d="M4 7h16v3a2 2 0 0 0 0 4v3H4v-3a2 2 0 0 0 0-4z"/><path d="M14 7v10" stroke-dasharray="2 2"/>',
    check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
    warn: '<path d="M12 3.5L2.5 20h19z"/><path d="M12 10v4.5M12 17.2v.3"/>',
    spark: '<path d="M12 4v4M12 16v4M4 12h4M16 12h4M7 7l2 2M15 15l2 2M17 7l-2 2M9 15l-2 2"/>',
    doc: '<path d="M7 3.5h7l4 4V20.5H7z"/><path d="M14 3.5v4h4M10 12h5M10 15.5h5"/>',
    chev: '<path d="M6 9l6 6 6-6"/>',
    mk: '<path d="M5 7.5h14v9H5z"/><path d="M9 11.5h6"/>'
  };
  function ic(n) {
    if (I24[n]) return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false">' + I24[n] + '</svg>';
    return '<svg class="ic" viewBox="0 0 20 20" aria-hidden="true" focusable="false">' + (I[n] || I.info) + '</svg>';
  }
  function mark(cls) { return '<span class="mark ' + (cls || '') + '" aria-hidden="true">' + ic('mk') + '</span>'; }
  function warnSolid() { return '<svg class="ic-warn" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 2.6 23 21.4H1z" fill="currentColor"/><path d="M12 9v6M12 17.6v.2" stroke="var(--danger)" stroke-width="2.4" stroke-linecap="round"/></svg>'; }
  var WT = { '08:00-12:00': '8:00 am – 12:00 pm', '12:00-16:00': '12:00 pm – 4:00 pm', '13:00-17:00': '1:00 pm – 5:00 pm', '16:00-19:00': '4:00 pm – 7:00 pm' };
  function wtxt(k) { return WT[k] || k; }
  function lv(icon, label, value, cls) { return '<div class="row ' + (cls || '') + '"><span class="row-l">' + label + '</span><b class="row-v">' + value + '</b></div>'; }
  function evt(icon, text, time, cls) {
    return '<p class="evt ' + (cls || '') + '">' + (cls && /evt-in|evt-status|evt-good/.test(cls) ? ic(icon) : '') + '<span class="evt-t">' + text + '</span>' + (time ? '<time>' + time + '</time>' : '') + '</p>';
  }
  function acard(icon, title, meta, body, cls) {
    return '<section class="acard ' + (cls || '') + '"><header class="cardhead">' + ic(icon) + '<h3>' + title + '</h3><span class="cardmeta">' + meta + '</span></header><div class="cardbody">' + body + '</div></section>';
  }
  function sources(keys, c) {
    return '<div class="srcs">' + keys.map(function (k) {
      var s = c.SRC[k];
      return '<details class="src"><summary>' + ic('doc') + '<span>' + s.file + '</span><span class="src-v">' + s.ver + '</span></summary><div class="src-b"><q>' + s.quote + '</q>' + (s.note ? '<p>' + s.note + '</p>' : '') + '</div></details>';
    }).join('') + '</div>';
  }

  /* ---------- cards ---------- */
  function cChecks(S, c) {
    var st = S.cards.checks || {};
    var body = '<ol class="checks">' + c.CHECKS.map(function (t) { return '<li>' + t + '</li>'; }).join('') + '</ol>' +
      (st.done ? evt('check', st.choice === 'skip' ? 'Checks skipped' : 'Tried. Still not cooling', '', 'evt-in')
        : '<div class="acts"><button type="button" class="btn btn-p" data-act="choose" data-key="checks" data-val="skip" data-fk="checks-skip">Skip the checks</button>' +
          '<button type="button" class="btn btn-q" data-act="choose" data-key="checks" data-val="tried" data-fk="checks-tried">I tried them. Still not cooling</button></div>');
    return acard('tool', 'Quick checks', 'Optional', body);
  }
  function cQuestion(card, S) {
    var st = S.cards[card.key] || {};
    var body = '<p class="q-t">' + card.q + '</p>' + (st.done ? evt('check', 'Answered: ' + { yes: 'Yes', no: 'No', skip: 'Skipped' }[st.choice], '', 'evt-in')
      : '<div class="acts" role="group" aria-label="Answer">' + [['yes', 'Yes'], ['no', 'No'], ['skip', 'Skip']].map(function (o) {
        return '<button type="button" class="btn btn-q" data-act="choose" data-key="' + card.key + '" data-val="' + o[0] + '" data-fk="' + card.key + '-' + o[0] + '">' + o[1] + '</button>';
      }).join('') + '</div>');
    return acard('question', 'Question ' + card.n + ' of 2', 'Optional', body, 'step-q');
  }
  function cWhere(S, c) {
    var st = S.cards.where || {};
    var body = st.done ? lv('', 'Visit area', 'Kyle 78640 · our south zone')
      : '<form class="inl" data-form="where" novalidate><label class="in"><span>ZIP code or city</span><input id="where-input" data-bind="where.value" data-fk="where-input" value="' + c.esc(st.value || '') + '" autocomplete="postal-code"' + (st.err ? ' aria-invalid="true"' : '') + '></label>' +
        '<button class="btn btn-p" data-fk="where-go">Show windows</button></form>' + (st.err ? '<p class="err" role="alert">' + st.err + '</p>' : '');
    return acard('pin', 'Where is the visit?', 'Assistant step', body);
  }
  function dayByKey(c, k) { var d = null; c.DAYS.forEach(function (x) { if (x.key === k) d = x; }); return d; }
  function cSlots(S, c) {
    var st = S.cards.slots || {};
    var day = dayByKey(c, st.day) || c.DAYS[0];
    var tabs = '<div class="daytabs" role="group" aria-label="Day">' + c.DAYS.map(function (d) {
      return '<button type="button" class="daytab" aria-pressed="' + (st.day === d.key) + '" data-act="slot-day" data-val="' + d.key + '" data-fk="day-' + d.d + '"' + (st.done ? ' disabled' : '') + '><span>' + d.dow + '</span><b>' + d.d + '</b></button>';
    }).join('') + '</div>';
    var anyOpen = false;
    var wins = '<div class="wins">' + day.wins.map(function (w) {
      var key = w[0];
      if (w[1] === 'open') {
        anyOpen = true;
        var sel = st.win === key;
        return '<button type="button" class="win' + (sel ? ' is-sel' : '') + '" data-act="slot-win" data-day="' + day.key + '" data-val="' + key + '" data-fk="chip-' + day.d + '-' + key + '" aria-pressed="' + sel + '"' + (st.done ? ' disabled' : '') + '>' + (sel ? ic('check') : '') + wtxt(key) + '</button>';
      }
      return '<button type="button" class="win is-taken" disabled><s>' + wtxt(key) + '</s><i>Taken</i></button>';
    }).join('') + '</div>' + (anyOpen ? '' : '<p class="hint">Every window on this day is taken.</p>');
    var rows = '<div class="rows">' + lv('', 'Area', 'Kyle 78640 · south zone') + lv('', 'Diagnostic visit', '$89') + '</div>';
    var foot = st.done
      ? evt('check', 'Window chosen: ' + day.long + ', ' + wtxt(st.win), '', 'evt-in')
      : '<p class="hint">Windows are shown, not held. Members’ fees and member-only windows appear after the code.</p><div class="acts"><button type="button" class="btn btn-p" data-act="slot-book" data-fk="slot-book">Continue with this window</button></div>' +
        (st.err ? '<p class="err" role="alert">' + st.err + '</p>' : '');
    return acard('cal', 'Choose a window', 'this week', tabs + wins + rows + foot, 'step-slots');
  }
  function cCode(S, c) {
    var st = S.cards.code || {};
    var body;
    if (st.stage === 'locate' && !st.done) {
      body = '<form class="stack" data-form="locate" novalidate><div class="two">' +
        '<label class="in"><span>Name on the account</span><input data-bind="code.name" data-fk="loc-name" value="' + c.esc(st.name || '') + '" autocomplete="name"></label>' +
        '<label class="in"><span>Phone</span><input data-bind="code.phone" data-fk="loc-phone" value="' + c.esc(st.phone || '') + '" inputmode="tel" autocomplete="tel"></label></div>' +
        '<div class="acts"><button class="btn btn-p" data-fk="loc-send">Send the code</button></div></form>' + (st.err ? '<p class="err" role="alert">' + st.err + '</p>' : '') +
        '<p class="hint">Demo: the dataset’s test customer. The code goes to the phone on record, never to a number typed here.</p>';
      return acard('shield', 'Confirming it’s you', 'Before booking', body);
    }
    if (st.done) return evt('shield', 'Verified for this chat · phone ending 02', '2:08 pm', 'evt-in');
    body = lv('', 'Code sent to', 'The phone on record, ending in 02') +
      '<form class="inl" data-form="code" novalidate><label class="in in-code"><span>6-digit code</span><input id="code-input" data-fk="code-input" inputmode="numeric" autocomplete="one-time-code" maxlength="6" value="' + (st.value || '') + '"' + (st.err ? ' aria-invalid="true" aria-describedby="code-err"' : '') + '></label>' +
      '<button class="btn btn-p" data-fk="code-verify">Verify</button></form>' + (st.err ? '<p class="err" id="code-err" role="alert">' + st.err + '</p>' : '') +
      '<p class="links"><a href="#code" data-act="inbox" data-fk="inbox-link">Open the demo inbox</a> <button type="button" class="linkbtn" data-act="stub" data-msg="Demo: a new code is offered here when a code has expired, up to the per-conversation cap. The code in the demo inbox stays 482913." data-fk="resend">Send a new code</button></p>' +
      '<p class="hint">Demo: codes go to a simulated inbox, never a real phone. A code lasts 10 minutes; 3 tries.</p>';
    return acard('shield', 'Confirming it’s you', 'Code sent', body);
  }
  function cConfirm(S) {
    var v = S.visit;
    var body = '<div class="rows">' + lv('', 'Date', v.day.full + ', 2026') + lv('', 'Window', wtxt(v.winKey)) + lv('', 'Technician', v.tech) + lv('', 'Fee that applies', '$89 diagnostic visit') + '</div>' +
      '<p class="hint">' + v.feeNote + '</p><h4 class="next-h">What happens next</h4><ul class="next">' +
      '<li>' + ic('check') + 'The technician arrives any time inside your window.</li>' +
      '<li>' + ic('check') + 'Changes are free until ' + v.freeUntil + '. After that, a $49 late-cancellation fee applies.</li></ul>';
    return acard('cal', 'Your visit', '<span class="tag">' + ic('check') + 'Booked</span>', body, 'step-visit');
  }
  function cAccount() {
    var rows = [['Diagnostic visit', '$89.00'], ['Contactor replacement', '$245.00'], ['After-hours dispatch', '$144.00']];
    var body = '<div class="rows">' + lv('', 'Issued', 'Oct 2, 2026') + lv('', 'Due', 'Nov 1, 2026') + '</div>' +
      '<table class="lines"><caption class="sr">Invoice lines</caption><thead><tr><th scope="col">Line</th><th scope="col">Amount</th></tr></thead><tbody>' +
      rows.map(function (r) { return '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td></tr>'; }).join('') + '</tbody><tfoot><tr><th scope="row">Total</th><td>$478.00</td></tr></tfoot></table>';
    return acard('receipt', 'Invoice INV-204411', 'Balance $478.00 · unpaid', body);
  }
  function byButton(S) {
    for (var i = S.items.length - 1; i >= 0 && i >= S.items.length - 3; i--) if (S.items[i].viaButton) return true;
    return false;
  }
  function created(r) { return '<div class="logevt">' + evt('receipt', 'Case ' + r.ref + ' created', '2:14 pm') + '</div>'; }
  function cHandoff(S, c) {
    var r = S.request, st = S.cards.follow || {};
    var reason = byButton(S) ? 'You asked for a person.' : 'Billing disputes go to a person. I can’t change or remove charges.';
    var body = '<p class="reason">' + reason + '</p><h3 class="promise">' + c.TXT.promise + '</h3><div class="rows">' + lv('', 'Due', 'Mon Oct 19, 7:00 pm') +
      lv('', 'Status', '<span class="tag">' + ic('clock') + 'Waiting for a representative</span>') + '</div>';
    if (st.done) {
      body += '<div class="saved">' + ic(st.channel === 'email' ? 'mail' : 'phone') + '<p>' + (st.channel === 'email' ? 'We’ll follow up by email, at the address on your account.'
        : 'We’ll follow up by phone, at the number ending in 02, ' + { mornings: 'in the morning', afternoons: 'in the afternoon', any: 'at any time' }[st.when] + '.') + '</p>' +
        '<button type="button" class="btn btn-q btn-s" data-act="follow-change" data-fk="fu-change">Change</button></div>';
    } else {
      var radio = function (name, val, label, sub, on, act) {
        return '<label class="radio"><input type="radio" name="' + name + '" value="' + val + '" data-act="' + act + '" data-val="' + val + '" data-fk="fu-' + val + '"' + (on ? ' checked' : '') + '><span>' + label + (sub ? '<small>' + sub + '</small>' : '') + '</span></label>';
      };
      body += '<fieldset class="fu"><legend>' + c.TXT.followAsk + '</legend>' +
        radio('fu-ch', 'email', 'Email', 'the address on your account', st.channel === 'email', 'follow-ch') +
        radio('fu-ch', 'phone', 'Phone call', 'the number ending in 02', st.channel === 'phone', 'follow-ch') + '</fieldset>' +
        (st.channel === 'phone' ? '<fieldset class="fu"><legend>Best time to call</legend>' + [['mornings', 'Mornings'], ['afternoons', 'Afternoons'], ['any', 'Any time']].map(function (o) {
          return radio('fu-when', o[0], o[1], '', st.when === o[0], 'follow-when');
        }).join('') + '</fieldset>' : '') +
        '<div class="acts"><button type="button" class="btn btn-p" data-act="follow-save" data-fk="fu-save">Save my choice</button></div>';
    }
    return created(r) + acard('ticket', 'Your request', '<code class="mono">' + r.ref + '</code>', body, 'step-handoff');
  }
  function cQueued(S, c) {
    var joined = S.live === 'joined';
    var body = '<p class="reason">' + (byButton(S) ? 'You asked for a person.' : 'Billing disputes go to a person. I can’t change or remove charges.') + '</p>' +
      '<h3 class="promise">' + c.TXT.queued + '</h3><div class="rows">' +
      lv('', 'Status', '<span class="tag">' + (joined ? ic('person') + 'A representative has joined this chat' : ic('clock') + 'Waiting for a representative') + '</span>') + '</div>';
    return created(S.request) + acard('ticket', 'Your request', '<code class="mono">' + S.request.ref + '</code>', body, 'step-handoff');
  }
  function card(cd, S, c) {
    switch (cd.type) {
      case 'checks': return cChecks(S, c);
      case 'question': return cQuestion(cd, S, c);
      case 'where': return cWhere(S, c);
      case 'slots': return S.cards.slots ? cSlots(S, c) : '';
      case 'confirm': return cConfirm(S, c);
      case 'code': return cCode(S, c);
      case 'account': return cAccount(S, c);
      case 'handoff': return cHandoff(S, c);
      case 'queued': return cQueued(S, c);
    }
    return '';
  }

  /* ---------- conversation: a name line over every message ---------- */
  var NAME = { assistant: 'Meridian assistant', customer: 'You', rep: 'Riley' };
  var SUFFIX = { assistant: ' · automated', customer: '', rep: ' · Representative (demo)' };
  function turnHTML(who, time, html, extra) {
    var lead = who === 'assistant' ? mark() : who === 'rep' ? '<span class="disc" aria-hidden="true">R</span>' : '';
    return '<div class="turn turn-' + who + '"><p class="name">' + lead + '<b>' + NAME[who] + '</b>' + SUFFIX[who] + ' · <time>' + time + '</time></p>' +
      (html ? '<div class="blk">' + html + '</div>' : '') + (extra || '') + '</div>';
  }
  function item(it, S, c) {
    if (it.kind === 'pending') return '<div class="logevt pending"><p class="evt"><span class="evt-t">' + (it.stage === 2 ? 'Still working on this…' : 'Meridian assistant is replying…') + '</span></p></div>';
    if (it.kind === 'event') return '<div class="logevt' + (it.icon === 'person' ? ' is-join' : '') + '">' + evt('info', it.html, it.time) + '</div>';
    var extra = (it.card ? card(it.card, S, c) : '') + (it.after ? '<div class="blk">' + it.after + '</div>' : '') + (it.sources ? sources(it.sources, c) : '');
    var t = turnHTML(it.who, it.time, it.html, extra);
    return it.quiet ? t.replace('class="turn turn-assistant', 'class="turn turn-assistant is-quiet') : t;
  }

  function safety(c, mode) {
    return '<section class="safety' + (mode ? ' safety-' + mode : '') + '"' + (mode ? '' : ' role="alert"') + ' aria-label="Danger: safety instruction">' +
      '<div class="sf-band">' + warnSolid() + '<p class="sf-w">DANGER</p></div>' +
      '<ol class="sf-list"><li>Leave the home immediately.</li><li>Call 911 or your gas utility from outside.</li></ol>' +
      "<p class=\"sf-p\">Don't flip any light switches, open windows near the furnace, or restart any equipment.</p></section>";
  }

  /* ---------- what's settled ---------- */
  function pnCard(icon, title, meta, body, cls) {
    return '<section class="acard pn-s' + cls + '"><header class="cardhead">' + ic(icon) + '<h3>' + title + '</h3><span class="cardmeta">' + meta + '</span></header><div class="cardbody">' + body + '</div></section>';
  }
  function panel(S, c, mode) {
    var h = mode === 'strip' ? '' : '<header class="pn-h"><h2>What’s settled</h2><p>Fills in as things are confirmed.</p></header>';
    if (S.safety) return h + safety(c, 'panel');
    var hl = function (k) { return S.hl === k ? ' is-hl' : ''; };
    var v = S.visit, r = S.request, out = h;
    if (S.staffing === 'sim') out += pnCard(S.live === 'joined' ? 'pause' : 'chat', 'Who is replying', '', '<p>' + (S.live === 'joined' ? 'Riley (demo representative). The assistant is paused.' : 'The automated assistant.') + '</p>', hl('control'));
    out += pnCard('cal', 'Your visit', '', v ? '<div class="rows">' + lv('', 'Date', v.day.long) + lv('', 'Window', wtxt(v.winKey)) + lv('', 'Technician', v.tech) + lv('', 'Fee', '$89 diagnostic visit') + '</div>' : '<p>Nothing booked yet.</p>', hl('visit') + (v ? '' : ' is-empty'));
    if (r && r.live) out += pnCard('ticket', 'Your request', '<code class="mono">' + r.ref + '</code>', '<div class="rows">' + lv('', 'Reference', r.ref) + '</div><p>' + (S.live === 'joined' ? 'A representative has joined this chat.' : 'Waiting for a representative to join. No time is promised.') + '</p>', hl('request'));
    else if (r) out += pnCard('ticket', 'Your request', '<code class="mono">' + r.ref + '</code>', '<p>A representative will get back to you within 1 business day.</p><div class="rows">' +
      lv('', 'Due', r.due) + lv('', 'Follow-up', r.follow ? r.follow.channel + (r.follow.when ? ', ' + r.follow.when.toLowerCase() : '') : 'Not chosen yet') + '</div>', hl('request'));
    else out += pnCard('ticket', 'Your request', '', '<p>No request open.</p>', ' is-empty');
    out += pnCard('shield', 'Identity', '', '<p>' + (S.identity === 'verified' ? 'Verified for this chat · phone ending 02' : S.identity === 'sent' ? 'Code sent to the phone ending in 02' : 'Not checked yet. Only needed for private details or a booking.') + '</p>', hl('identity') + (S.identity ? '' : ' is-empty'));
    return out;
  }
  function stripSummary(S) {
    if (S.safety) return ic('warn') + '<span class="st-l">Leave the home</span>';

    updateComposer();
    RUN[target](g, { trigger: 'button' }).then(function () { if (g !== gen) return; S.next = nextLine(target); updateComposer(); })
      .catch(function (e) { if (!(e instanceof Stop)) throw e; });
  }

  /* ---------- prototype bar (identical in every direction file) ---------- */
  var DIRS = [
    { code: 'A5', name: 'A5 Service desk', file: '2026-10-21-direction-A5-service-desk.html' }
  ];
  function protoBar() {
    var links = STEPS.map(function (s, i) {
      return '<li><a href="#' + s.id + '" data-step="' + s.id + '"><span class="pj-n">' + (i + 1) + '</span><span class="pj-l">' + esc(s.label) + '</span><span class="pj-s">' + s.screen + '</span></a></li>';
    }).join('');
    return '<div class="proto-bar" role="region" aria-label="Prototype controls">' +
      '<span class="pb-name"><b>' + esc(SK.code) + '</b> <span class="pb-long">' + esc(SK.name) + ' · direction prototype</span></span>' +
      '<span class="pb-tools">' +
      '<button type="button" class="pb-btn" popovertarget="jump-menu" id="jump-btn" aria-haspopup="true">Jump to</button>' +
      '<button type="button" class="pb-btn" id="slow-btn" data-act="slow" aria-pressed="false" title="Demo: hold the assistant’s next replies back so the waiting lines show.">Slow reply</button>' +
      DIRS.filter(function (d) { return d.code !== SK.code; }).map(function (d) {
        return '<a class="pb-btn switch-link" data-file="' + d.file + '" href="' + d.file + '#greeting" aria-label="Switch to ' + esc(d.name) + ' at this step">' + d.code + '</a>';
      }).join('') +
      '<button type="button" class="pb-btn" id="theme-btn" data-act="theme">Dark</button>' +
      '</span>' +
      '<nav id="jump-menu" popover aria-label="Jump to a step"><p class="pj-h">Scripted story · 8 steps</p><ol>' + links + '</ol>' +
      '<p class="pj-f">Synthetic demo data. Nothing is sent or booked.</p></nav>' +
      '</div>';
  }
  function syncProto(id) {
    var sws = document.querySelectorAll('.switch-link');
    for (var k = 0; k < sws.length; k++) sws[k].href = sws[k].getAttribute('data-file') + '#' + id;
    var as = document.querySelectorAll('#jump-menu a');
    for (var i = 0; i < as.length; i++) {
      if (as[i].getAttribute('data-step') === id) as[i].setAttribute('aria-current', 'step'); else as[i].removeAttribute('aria-current');
    }
  }

  /* ---------- theme ---------- */
  var dmq = window.matchMedia('(prefers-color-scheme: dark)');
  function effectiveTheme() { var t = document.documentElement.getAttribute('data-theme'); return t || (dmq.matches ? 'dark' : 'light'); }
  function syncThemeBtn() { var b = $('#theme-btn'); if (b) { var dark = effectiveTheme() === 'dark'; b.textContent = dark ? 'Light' : 'Dark'; b.setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme'); } }
  function toggleTheme() {
    var next = effectiveTheme() === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('mhc-proto-theme', next); } catch (e) { /* storage may be blocked */ }
    syncThemeBtn();
  }
  try { var saved = localStorage.getItem('mhc-proto-theme'); if (saved && !document.documentElement.getAttribute('data-theme')) document.documentElement.setAttribute('data-theme', saved); } catch (e) { /* ignore */ }

  /* ---------- toast ---------- */
  var toastTimer;
  function toast(msg) {
    var t = $('#toast'); if (!t) return;
    t.textContent = msg; t.classList.add('is-on');
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('is-on'); }, 3200);
  }

  /* ---------- events ---------- */
  document.addEventListener('click', function (e) {
    var a = e.target.closest('[data-act]');
    var jl = e.target.closest('#jump-menu a');
    if (jl) { var m = $('#jump-menu'); if (m && m.hidePopover) { try { m.hidePopover(); } catch (x) { /* closed */ } } }
    if (!a) return;
    var act = a.getAttribute('data-act'), key = a.getAttribute('data-key'), val = a.getAttribute('data-val');
    switch (act) {
      case 'theme': toggleTheme(); break;
      case 'slow': slowMode = !slowMode; a.setAttribute('aria-pressed', slowMode ? 'true' : 'false');
        toast(slowMode ? 'Slow reply is on. The next replies wait about 13 seconds: a replying line first, “Still working on this…” after 10 seconds.' : 'Slow reply is off.');
        if (!slowMode && pendingCancel) pendingCancel();
        break;
      case 'talk': talk(); break;
      case 'choose': if (waiters[key]) resolve(key, val); break;
      case 'slot-day': S.cards.slots.day = val; S.cards.slots.win = null; S.cards.slots.err = ''; refreshCard('slots'); break;
      case 'slot-win': if (a.getAttribute('data-day')) S.cards.slots.day = a.getAttribute('data-day'); S.cards.slots.win = val; S.cards.slots.err = ''; refreshCard('slots'); break;
      case 'slot-book':
        if (!S.cards.slots.win) { S.cards.slots.err = 'Pick an arrival window first.'; refreshCard('slots'); break; }
        resolve('slots', 'pick'); break;
      case 'inbox': e.preventDefault(); openInbox(); break;
      case 'inbox-use': S.cards.code.value = CODE; S.cards.code.err = ''; closeInbox(); refreshCard('code'); var ci = $('#code-input'); if (ci) ci.focus(); break;
      case 'inbox-close': closeInbox(); break;
      case 'follow-ch': S.cards.follow.channel = val; refreshCard('follow'); break;
      case 'follow-when': S.cards.follow.when = val; refreshCard('follow'); break;
      case 'follow-save':
        if (waiters.follow) { resolve('follow', 'save'); break; }
        if (S.cards.follow) { S.cards.follow.done = true; applyFollow(); refreshCard('follow'); land('request'); toast('Follow-up choice updated.'); }
        break;
      case 'follow-change': if (S.cards.follow) { S.cards.follow.done = false; refreshCard('follow'); } break;
      case 'demo-join': if (waiters.join) resolve('join', 'join'); break;
      case 'stub': toast(a.getAttribute('data-msg') || 'Not part of this direction prototype.'); break;
      case 'case-select': CS.sel = val; CS.callOpen = CS.flagOpen = false; renderCase('q-' + val); break;
      case 'case-tab': CS.tab = val; renderCase('tab-' + val); break;
      case 'src-jump': CS.tab = 'sources'; CS.hl = val; renderCase(); var s = document.getElementById('src-' + val); if (s) { s.scrollIntoView({ block: 'nearest', behavior: calm() ? 'auto' : 'smooth' }); s.focus({ preventScroll: true }); }
        if (!calm()) setTimeout(function () { if (CS.hl === val) { CS.hl = null; var x = document.getElementById('src-' + val); if (x) x.classList.remove('is-hl'); } }, 1800); else CS.hl = null;
        break;
      case 'case-claim': CS.claimed = true; CS.acts.push({ time: 'Fri 2:20 pm', text: 'Claimed by Riley (demo representative).' }); renderCase('act-call'); break;
      case 'case-call': CS.callOpen = !CS.callOpen; CS.flagOpen = false; renderCase(CS.callOpen ? 'call-outcome' : 'act-call'); break;
      case 'case-flag': CS.flagOpen = !CS.flagOpen; CS.callOpen = false; renderCase(CS.flagOpen ? 'flag-reason' : 'act-flag'); break;
      case 'case-join': toast('Join chat works only while the customer is in a live chat.'); break;
    }
  });
  document.addEventListener('input', function (e) {
    if (e.target.id === 'code-input' && S.cards.code) { S.cards.code.value = e.target.value.replace(/\D/g, '').slice(0, 6); }
    var bind = e.target.getAttribute && e.target.getAttribute('data-bind');
    if (bind) { var bp = bind.split('.'); if (S.cards[bp[0]]) S.cards[bp[0]][bp[1]] = e.target.value; }
  });
  document.addEventListener('submit', function (e) {
    var f = e.target, kind = f.getAttribute('data-form');
    if (!kind) return;
    e.preventDefault();
    if (kind === 'composer') { var v = ($('#composer-input').value || '').trim(); advance(v); return; }
    if (kind === 'where') {
      var wv = (S.cards.where.value || '').trim();
      if (!/^(78640|kyle)\b/i.test(wv)) { S.cards.where.err = 'This scripted demo covers Kyle (78640). Try that ZIP.'; refreshCard('where'); var wi = $('#where-input'); if (wi) wi.focus(); return; }
      S.cards.where.err = ''; resolve('where', 'ok'); return;
    }
    if (kind === 'locate') {
      var lc = S.cards.code;
      if (!(lc.name || '').trim() || !(lc.phone || '').trim()) { lc.err = 'Enter the name and phone on the account.'; refreshCard('code'); return; }
      lc.err = ''; lc.stage = 'sent'; S.identity = 'sent'; land('identity'); refreshCard('code');
      var cin = $('#code-input'); if (cin) cin.focus();
      return;
    }
    if (kind === 'code') {
      var c = S.cards.code;
      if (c.done) return;
      if (c.value === CODE) { c.err = ''; resolve('code', 'ok'); return; }
      c.attempts = (c.attempts || 0) + 1;
      c.err = c.attempts >= 3 ? 'No tries left. In the product this goes to a person, and nothing about the account is shown (FLOW-3).'
        : (c.value.length !== 6 ? 'Enter all 6 digits.' : "That code doesn't match. " + (3 - c.attempts) + (3 - c.attempts === 1 ? ' try' : ' tries') + ' left.');
      refreshCard('code');
      var ci = $('#code-input'); if (ci) ci.focus();
      return;
    }
    if (kind === 'call') {
      var out = f.querySelector('[name=outcome]:checked');
      CS.acts.push({ time: 'Fri 2:22 pm', text: 'Call logged: ' + (out ? out.value : 'No answer') + '. Demo: recorded, not sent.' });
      CS.callOpen = false; renderCase('act-call'); return;
    }
    if (kind === 'flag') {
      var r = f.querySelector('select'); CS.flagged = r ? r.value : 'Other';
      CS.acts.push({ time: 'Fri 2:23 pm', text: 'Flagged for review: ' + CS.flagged + '.' });
      CS.flagOpen = false; renderCase('act-flag'); return;
    }
  });
  document.addEventListener('keydown', function (e) {
    var appEl = $('#app');
    if (appEl && appEl.getAttribute('data-view') === 'case') {
      var row = e.target.closest && e.target.closest('[data-queue] [data-ref]');
      if (!row) return;
      var rows = Array.prototype.slice.call(document.querySelectorAll('[data-queue] [data-ref]'));
      var i = rows.indexOf(row);
      if (e.key === 'j' || e.key === 'ArrowDown') { e.preventDefault(); if (rows[i + 1]) rows[i + 1].focus(); }
      if (e.key === 'k' || e.key === 'ArrowUp') { e.preventDefault(); if (rows[i - 1]) rows[i - 1].focus(); }
    }
  });

  /* demo inbox (stub of SCR-2) */
  function openInbox() {
    var d = $('#inbox');
    if (!d) { document.body.insertAdjacentHTML('beforeend', SK.inbox(ctx)); d = $('#inbox'); }
    if (d.showModal) d.showModal(); else d.setAttribute('open', '');
  }
  function closeInbox() { var d = $('#inbox'); if (d && d.close) d.close(); }

  /* ---------- boot ---------- */
  function boot() {
    document.body.insertAdjacentHTML('afterbegin', protoBar());
    if (!$('#app')) document.body.insertAdjacentHTML('beforeend', '<div id="app"></div>');
    if (!$('#toast')) document.body.insertAdjacentHTML('beforeend', '<div id="toast" role="status" aria-live="polite"></div>');
    syncThemeBtn();
    dmq.addEventListener && dmq.addEventListener('change', syncThemeBtn);
    window.addEventListener('hashchange', function () { goTo(location.hash.slice(1)); });
    goTo(location.hash.slice(1) || 'greeting');
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
</body>
