[project]
name = "meridian-agent"
version = "0.1.0"
description = "Meridian Home Comfort AI service agent (AEA FDE Challenge)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "anthropic>=0.40",
  "langgraph>=0.2.60",
  "langgraph-checkpoint-sqlite>=2.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "jinja2>=3.1",
  "python-multipart>=0.0.12",
  "pydantic>=2.9",
  "fastembed>=0.4",
  "numpy>=1.26",
  "pypdf>=5.0",
  "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meridian"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
