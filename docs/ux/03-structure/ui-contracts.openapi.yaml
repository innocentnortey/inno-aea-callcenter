                    type: array
                    items:
                      type: object
                      properties:
                        slot_id:
                          type: string
                        date:
                          type: string
                          format: date
                        window:
                          type: string
                        window_label:
                          type: string
                        technician:
                          type: string
                        member_only:
                          type: boolean
                        taken:
                          type: boolean
