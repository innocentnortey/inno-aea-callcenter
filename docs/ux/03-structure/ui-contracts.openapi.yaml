              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          description: 503 RESET_IN_PROGRESS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                RESET_IN_PROGRESS:
                  summary: Reset running
                  value:
                    error:
                      code: RESET_IN_PROGRESS
                      field: null
                      constraint: null
                      details:
                        retry_after_ms: 5000
                    request_id: req_8f2a41
      x-timing:
        p95_ms: 1000
        basis: "[A]"
      x-data-class: Redacted examples from the dev split only. No PII.
      x-roles: *a1
  /api/login:
    post:
      operationId: login
      x-con: CON-22
      tags:
        - session
      summary: Demo login (username and password)
      description: "**The one gate for the whole deployment (decided 2026-10-21, R-48).** Username and password come from the Railway variables MERIDIAN_DEMO_USERNAME and MERIDIAN_DEMO_PASSWORD (one pair, shared with reviewers). Success sets the `mhc_session` cookie and starts the session as the **customer** role. Every other route except this one and /healthz answers 401 UNAUTHENTICATED without it. One message for every failure (LOGIN_FAILED), and attempts are rate limited per IP. Examples use placeholders only."
      responses:
        "200":
          description: Signed in
          headers:
            X-Request-ID: &a2
              schema:
                type: string
            Set-Cookie:
              description: mhc_session (HttpOnly, SameSite=Lax, Secure in deploy)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
              examples:
                LOGGED_IN:
                  summary: Signed in as the customer role
                  value:
                    session: &a4
                      authenticated: true
                      role: customer
                      display_name: Customer (demo)
                      sees:
                        - Chat
                        - Demo guide
                        - Demo inbox
                        - Monitoring
                        - Evaluation
                      signed_in_at: 2026-10-16T14:00:00-05:00
                    landing: /
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/LoginFailed"
        "429":
          $ref: "#/components/responses/LoginRateLimited"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              PLACEHOLDERS:
                summary: Placeholders only
                value:
                  username: <demo-username>
                  password: <demo-password>
      x-data-class: "SECRET: the credentials are compared by code, never logged, traced or returned."
      x-timing:
        p95_ms: 500
        basis: "[A]"
  /api/logout:
    post:
      operationId: logout
      x-con: CON-22
      tags:
        - session
      summary: Log out
      description: "Ends the login session: the cookie is cleared, the role and inbox scope go with it, and the session's chat threads can no longer be read. Idempotent."
      responses:
        "204":
          description: Logged out
          headers: &a3
            X-Request-ID: *a2
        "401":
          $ref: "#/components/responses/Unauthenticated"
      security:
        - mhcSession: []
      x-data-class: No PII.
      x-timing:
        p95_ms: 500
        basis: "[A]"
  /api/session:
    get:
      operationId: getSession
      x-con: CON-10
      tags:
        - session
      summary: Who am I and which role
      description: Returns the signed-in session and its current role, so the shared header can show the role switcher and the right chrome. 401 UNAUTHENTICATED sends the page to the login screen (SCR-12).
      responses:
        "200":
          description: The session
          headers: *a3
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
              examples:
                CUSTOMER:
                  summary: Customer role
                  value: *a4
                REPRESENTATIVE:
                  summary: Riley
                  value: &a5
                    authenticated: true
                    role: representative
                    display_name: Riley, demo representative
                    sees:
                      - Queue
                      - Cases
                      - Live chat
                      - Review list
                    signed_in_at: 2026-10-16T14:00:00-05:00
        "401":
          $ref: "#/components/responses/Unauthenticated"
      security:
        - mhcSession: []
      x-roles:
        - customer
        - representative
        - supervisor
        - owner
      x-data-class: No PII. Roles are demo labels.
      x-timing:
        p95_ms: 500
        basis: "[A]"
  /api/session/roles:
    get:
      operationId: listDemoRoles
      x-con: CON-10
      tags:
        - session
      summary: List the four demo roles
      description: Customer, representative, supervisor, owner, each with what it sees. For the role switcher.
      responses:
        "200":
          description: Roles
          headers: *a3
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RolesResponse"
              examples:
                ROLES:
                  summary: Four roles
                  value:
                    roles:
                      - role: customer
                        display_name: Customer (demo)
                        sees: The chat, the demo guide, the demo inbox, monitoring and evaluation
                      - role: representative
                        display_name: Riley, demo representative
                        sees: The queue and cases; can claim, join, reply, log, flag
                      - role: supervisor
                        display_name: Demo supervisor
                        sees: Urgent, unowned, due-soon, overdue and stuck cases; assigns; runs the demo shift and clock
                      - role: owner
                        display_name: Demo business owner
                        sees: Outcomes, and opens the cases behind them (read only)
        "401":
          $ref: "#/components/responses/Unauthenticated"
      security:
        - mhcSession: []
      x-roles:
        - customer
        - representative
        - supervisor
        - owner
      x-data-class: No PII.
      x-timing:
        p95_ms: 500
        basis: "[A]"
  /api/session/role:
    put:
      operationId: switchRole
      x-con: CON-10
      tags:
        - session
      summary: Switch role (one click from any screen)
      description: "**A role switch for a signed-in session, with no passcode** (decided, R-48): customer, representative, supervisor or owner. It changes the current role on the same `mhc_session`, so the customer chat in one tab keeps working while another tab is staff (chat routes do not check the role; staff routes do). Switching to customer ends nothing. It does not change the inbox scope or thread ownership."
      responses:
        "200":
          description: The new role
          headers: *a3
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
              examples:
                TO_REPRESENTATIVE:
                  summary: Riley
                  value: *a5
                TO_SUPERVISOR:
                  summary: Supervisor
                  value:
                    authenticated: true
                    role: supervisor
                    display_name: Demo supervisor
                    sees:
                      - Oversight
                      - Review list
                      - Queue
                      - Demo controls
                    signed_in_at: 2026-10-16T14:00:00-05:00
                TO_OWNER:
                  summary: Owner
                  value:
                    authenticated: true
                    role: owner
                    display_name: Demo business owner
                    sees:
                      - Outcomes
                      - Cases (read only)
                    signed_in_at: 2026-10-16T14:00:00-05:00
                TO_CUSTOMER:
                  summary: Customer
                  value: *a4
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/ResetInProgress"
      security:
        - mhcSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwitchRoleRequest"
            examples:
              REPRESENTATIVE:
                summary: Riley
                value:
                  role: representative
              SUPERVISOR:
                summary: Supervisor
                value:
                  role: supervisor
              OWNER:
                summary: Owner
                value:
                  role: owner
              CUSTOMER:
                summary: Customer
                value:
                  role: customer
      x-roles:
        - customer
        - representative
        - supervisor
        - owner
      x-data-class: No PII. Roles are demo labels.
      x-timing:
        p95_ms: 500
        basis: "[A]"
components:
  securitySchemes:
    mhcSession:
      type: apiKey
      in: cookie
      name: mhc_session
      description: The one demo session cookie, set by login (CON-22). It identifies the login session (owns this session's chat threads and scopes the demo inbox) and carries the current role (customer, representative, supervisor, owner). It replaces mhc_demo and mhc_staff, which are retired. HttpOnly, SameSite=Lax, Secure in deploy.
  schemas:
    Speaker:
      type: object
      properties:
        kind:
          type: string
          enum:
            - assistant
            - customer
            - representative
            - event
        display_name:
          type:
            - string
            - "null"
      required:
        - kind
        - display_name
      description: Who a block or message is from. Rendered as 'Meridian assistant · automated', 'You', 'Riley · representative (demo)'. Event lines have no name.
    Option:
      type: object
      properties:
        option:
          type: string
          description: Value posted back as a `choice` payload
        label:
          type: string
        disabled:
          type: boolean
        reason:
          type:
            - string
            - "null"
          description: Why disabled, in words
      required:
        - option
        - label
        - disabled
        - reason
    SourceChip:
      type: object
      properties:
        passage_id:
          type: string
        file:
          type: string
          description: e.g. policies/fee_schedule_2026.pdf
        section:
          type: string
        version_date:
          type:
            - string
            - "null"
          format: date
          description: Null when the file is not dated.
        excerpt:
          type: string
          description: Quoted passage shown when the chip opens
        audience:
          const: customer
          description: Staff-only sources (agent_discretion_notes.md) never appear in a customer response
        version_label:
          type: string
          description: The version as the file states it, e.g. "Rev 2026-01", "2026 (image)", "undated". Never an invented date.
      required:
        - passage_id
        - file
        - section
        - version_date
        - excerpt
        - audience
        - version_label
      description: "Source chip: 'SRC · Where this comes from'. Customer-visible sources only."
    Money:
      type: object
      properties:
        amount_cents:
          type: integer
        display:
          type: string
          description: The string policy text uses, e.g. $49
      required:
        - amount_cents
        - display
    FollowUpOptions:
      type: object
      properties:
        legend:
          type: string
        channels:
          type: array
          items:
            type: object
            properties:
              channel:
                type: string
                enum:
                  - email
                  - phone
              label:
                type: string
                description: Masked destination in words
              on_record:
                type: boolean
            required:
              - channel
              - label
              - on_record
        windows:
          type: array
          items:
            type: object
            properties:
              window:
                type: string
                enum:
                  - morning
                  - afternoon
                  - any
              label:
                type: string
            required:
              - window
              - label
        general_only:
          type: boolean
          description: "True for an unverified customer: only a general destination can be saved (R-27)"
      required:
        - legend
        - channels
        - windows
        - general_only
    FollowUpView:
      type: object
      properties:
        channel:
          type: string
          enum:
            - email
            - phone
        destination_label:
          type: string
          description: e.g. the number ending in 02
        on_record:
          type: boolean
        window:
          type: string
          enum:
            - morning
            - afternoon
            - any
        saved_line:
          type: string
          description: "e.g. Follow-up saved: phone call, the number ending in 02, mornings. Never says a message was sent."
      required:
        - channel
        - destination_label
        - on_record
        - window
        - saved_line
    SettledVisit:
      type: object
      properties:
        appointment_id:
          type: integer
        date:
          type: string
          format: date
        window:
          type: string
          description: HH:MM-HH:MM
        window_label:
          type: string
        technician:
          type: string
        service_type:
          type: string
        fee_line:
          type: string
        status:
          type: string
          enum:
            - booked
            - moved
            - original_stays
        change_request:
          oneOf:
            - type: object
              properties:
                change:
                  type: string
                  enum:
                    - move
                    - cancel
                wanted_text:
                  type: string
                fee_line:
                  type: string
                  description: The $49 fee applies under current policy.
              required:
                - change
                - wanted_text
                - fee_line
            - type: "null"
      required:
        - appointment_id
        - date
        - window
        - window_label
        - technician
        - service_type
        - fee_line
        - status
        - change_request
      description: The visit this conversation wrote or changed MOST RECENTLY. Any other visit (the booking cap is 3) stays visible in settled.actions[]. (UXR-21)
    SettledRequest:
      type: object
      properties:
        reference:
          type: string
        promise_text:
          type: string
          description: Policy-table text, produced by code (R-26)
        due_at:
          type:
            - string
            - "null"
          format: date-time
        due_label:
          type:
            - string
            - "null"
          description: The label the server used, e.g. by Monday, October 19, 7:00 pm
        extra_lines:
          type: array
          items:
            type: string
        live_queued:
          type: boolean
        followup:
          oneOf:
            - $ref: "#/components/schemas/FollowUpView"
            - type: "null"
      required:
        - reference
        - promise_text
        - due_at
        - due_label
        - extra_lines
        - live_queued
        - followup
    Write:
      type: object
      properties:
        kind:
          type: string
          enum:
            - booked
            - moved
            - cancelled
            - change_request_sent
            - case_opened
            - followup_saved
            - verified
        summary:
          type: string
        turn_id:
          type: string
        at:
          type: string
          format: date-time
      required:
        - kind
        - summary
        - turn_id
        - at
      description: One completed write. Completion wording ('booked', 'cancelled') is allowed only for a kind present here.
    Settled:
      type: object
      properties:
        built_from:
          const: conversation_state
          description: Built from every completed write in the conversation (the actions and cases rows), never from the last turn alone (N-27, R-45, R-46)
        visit:
          oneOf:
            - $ref: "#/components/schemas/SettledVisit"
            - type: "null"
          description: Most recently written or changed visit only; see settled.actions[] for the rest.
        request:
          oneOf:
            - $ref: "#/components/schemas/SettledRequest"
            - type: "null"
        identity:
          type: object
          properties:
            status:
              type: string
              enum:
                - not_checked
                - code_sent
                - verified
                - not_verified
                - locked
            hint:
              type:
                - string
                - "null"
              description: Masked only, e.g. the phone ending in 02. Never the code.
          required:
            - status
            - hint
        replying:
          type: object
          properties:
            kind:
              type: string
              enum:
                - ai
                - human
            display_name:
              type:
                - string
                - "null"
          required:
            - kind
            - display_name
        actions:
          type: array
          items:
            $ref: "#/components/schemas/Write"
          description: Everything this conversation has completed, oldest first
      required:
        - built_from
        - visit
        - request
        - identity
        - replying
        - actions
      description: The C2 'What's settled' panel, rendered from the contract (N-4).
    BlockBase:
      type: object
      properties:
        block_id:
          type: string
        type:
          type: string
        speaker:
          $ref: "#/components/schemas/Speaker"
        at:
          type: string
          format: date-time
      required:
        - block_id
        - type
        - speaker
        - at
    TextBlock:
      allOf:
        - $ref: "#/components/schemas/BlockBase"
        - type: object
          required:
            - type
            - text
            - sources
          properties:
            type:
              const: text
            text:
              type: string
            sources:
              type: array
              items:
                $ref: "#/components/schemas/SourceChip"
      description: Answer text. Policy answers carry at least one source chip.
    SourceChipBlock:
      allOf:
        - $ref: "#/components/schemas/BlockBase"
        - type: object
          required:
            - type
            - source
          properties:
            type:
              const: source_chip
            source:
              $ref: "#/components/schemas/SourceChip"
    SafetyBlock:
      allOf:
        - $ref: "#/components/schemas/BlockBase"
        - type: object
          required:
            - type
            - level
            - signal_word
            - steps
            - call_key
            - contact_line
            - case_priority
            - case_reference
            - fixed_text
            - pinned
          properties:
            type:
              const: safety
            level:
              const: DANGER
            signal_word:
              type: string
            steps:
              type: array
              items:
                type: string
            call_key:
              type: object
              properties:
                label:
                  type: string
                number:
                  type: string
              required:
                - label
                - number
            contact_line:
              type: string
              description: The quiet line under the card; no field, no question, no follow-up time
            case_priority:
              const: P0
            case_reference:
              type:
                - string
                - "null"
            fixed_text:
              const: true
            pinned:
              const: true
      description: Safety card. Fixed text from Meridian's policy, no model. Pinned, not dismissible. Red is used only here.
    ConditionalSafetyBlock:
      allOf:
        - $ref: "#/components/schemas/BlockBase"
        - type: object
          required:
            - type
            - level
            - text
            - emergency_line
            - case_priority
            - case_reference
            - fixed_text
          properties:
            type:
              const: conditional_safety
            level:
              const: WARNING
            text:
              type: string
            emergency_line:
              type: string
            case_priority:
              const: P1
            case_reference:
              type:
                - string
                - "null"
            fixed_text:
              const: true
      description: Burning smell, risk unclear (R-7).
    BurningCheckBlock:
      allOf:
        - $ref: "#/components/schemas/BlockBase"
        - type: object
          required:
            - type
            - card_id
            - options
            - answered
            - question
          properties:
            type:
              const: burning_check
            card_id:
              type: string
              description: Id of the card; posted back on a choice, code or form payload
            options:
              type: array
              items:
                $ref: "#/components/schemas/Option"
            answered:
              type:
                - string
                - "null"
              description: The option already chosen, or null
            question:
              type: string
      description: Yes / No / Not sure.
    EmergencyLineBlock:
      allOf:
        - $ref: "#/components/schemas/BlockBase"
        - type: object
          required:
            - type
            - lead_text
            - number
            - number_note
            - separate_line
            - case_priority
            - case_reference
          properties:
            type:
              const: emergency_line
            lead_text:
              type: string
            number:
              type: string
            number_note:
              type: string
            separate_line:
              type:
                - string
                - "null"
              description: The 1-business-day line; only when nobody is online
            case_priority:
              const: P1
            case_reference:
              type: string
      description: Someone in danger from no heat, no cooling or a leak (R-8).
    QuickChecksBlock:
      allOf:
        - $ref: "#/components/schemas/BlockBase"
        - type: object
          required:
            - type
            - card_id
            - options
            - answered
            - offer_text
            - checks
          properties:
            type:
              const: quick_checks
            card_id:
              type: string
              description: Id of the card; posted back on a choice, code or form payload
            options:
              type: array
              items:
                $ref: "#/components/schemas/Option"
            answered:
              type:
                - string
                - "null"
              description: The option already chosen, or null
            offer_text:
              type: string
            checks:
              oneOf:
                - type: array
                  items:
                    type: object
                    properties:
                      text:
                        type: string
                      source:
                        $ref: "#/components/schemas/SourceChip"
                    required:
                      - text
                      - source
                - type: "null"
      description: "Very optional (R-44). Options: skip_and_book (primary), show_checks."
    UrgencyQuestionsBlock:
      allOf:
        - $ref: "#/components/schemas/BlockBase"
        - type: object
          required:
            - type
            - card_id
            - options
            - answered
            - questions
            - skippable
          properties:
            type:
              const: urgency_questions
            card_id:
              type: string
              description: Id of the card; posted back on a choice, code or form payload
            options:
              type: array
              items:
                $ref: "#/components/schemas/Option"
            answered:
              type:
                - string
                - "null"
              description: The option already chosen, or null
            questions:
              type: array
              items:
                type: object
                properties:
                  question_id:
                    type: string
                  text:
                    type: string
                  answers:
                    type: array
                    items:
                      $ref: "#/components/schemas/Option"
                required:
                  - question_id
                  - text
                  - answers
            skippable:
              const: true
    WherePromptBlock:
      allOf:
        - $ref: "#/components/schemas/BlockBase"
        - type: object
          required:
            - type
            - card_id
            - options
            - answered
            - label
            - submit_label
          properties:
            type:
              const: where_prompt
            card_id:
              type: string
              description: Id of the card; posted back on a choice, code or form payload
            options:
              type: array
              items:
                $ref: "#/components/schemas/Option"
            answered:
              type:
                - string
                - "null"
              description: The option already chosen, or null
            label:
              type: string
            submit_label:
              type: string
      description: Answered with a `form` payload (zip_or_city).
    LocatePromptBlock:
      allOf:
        - $ref: "#/components/schemas/BlockBase"
        - type: object
          required:
            - type
            - card_id
            - options
            - answered
            - reason_text
            - field_sets
          properties:
            type:
              const: locate_prompt
            card_id:
              type: string
              description: Id of the card; posted back on a choice, code or form payload
            options:
              type: array
              items:
                $ref: "#/components/schemas/Option"
            answered:
              type:
                - string
                - "null"
              description: The option already chosen, or null
            reason_text:
              type: string
            field_sets:
              type: array
              items:
                type: array
                items:
                  type: string
                  enum:
                    - name
                    - phone
                    - customer_id
                    - invoice_number
      description: Answered with a `form` payload. A locator is not proof of identity (R-15).
    CodePromptBlock:
      allOf:
        - $ref: "#/components/schemas/BlockBase"
        - type: object
          required:
            - type
            - card_id
            - options
            - answered
            - state
            - hint
            - tries_left
            - expires_at
            - resend_offered
            - resends_left
            - inbox_link
            - code_in_response
          properties:
            type:
              const: code_prompt
            card_id:
              type: string
              description: Id of the card; posted back on a choice, code or form payload
            options:
              type: array
              items:
                $ref: "#/components/schemas/Option"
            answered:
              type:
                - string
                - "null"
              description: The option already chosen, or null
            state:
              type: string
              enum:
                - sent
                - wrong
                - expired
                - locked
            hint:
              type: string
              description: "Masked only: the phone on record, ending in 02"
            tries_left:
              type:
                - integer
                - "null"
            expires_at:
              type:
                - string
                - "null"
              format: date-time
            resend_offered:
              type: boolean
            resends_left:
              type:
                - integer
                - "null"
              description: Per-conversation cap of 3 codes (decided 2026-10-21)
            inbox_link:
              type: string
              description: Link to the demo inbox, /demo/inbox
            code_in_response:
              const: never
              description: The code is never in this contract. Only CON-6 carries it.
      description: Answered with a `code` payload (6 digits).
    SlotCardBlock:
      allOf:
        - $ref: "#/components/schemas/BlockBase"
