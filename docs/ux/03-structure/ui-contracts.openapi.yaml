            - answered
            - urgent
            - days
            - standard_fee
            - hint
            - members_note
          properties:
            type:
              const: slot_card
            card_id:
              type: string
              description: Id of the card; posted back on a choice, code or form payload
            options:
              type: array
              items:
                $ref: "#/components/schemas/Option"
            answered:
              type:
                - string
                - "null"
              description: The option already chosen, or null
            urgent:
              type: boolean
            days:
              type: array
              items:
                type: object
                properties:
                  date:
