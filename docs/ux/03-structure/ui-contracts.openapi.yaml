  /api/chat/sessions/{thread_id}/events:
    get:
      operationId: streamChatEvents
      x-con: CON-3
      tags:
        - chat
      summary: Live events for one chat (Server-Sent Events, with replay)
      description: "Opened by the page on **every** chat session, not only a live handoff. Async, holds no worker thread. Each event has an integer `id`; on reconnect send `Last-Event-ID` and missed events replay in order. Heartbeat comment every 15 s (decided 2026-10-21). Event types: representative_joined, staff_message, ai_paused, ai_resumed, chat_closed, staffing_changed, shift_ended (carries the async promise and the SAME reference), clock_changed, demo_reset. After chat_closed or demo_reset the server closes the stream. No progress events exist. The data payload of each event is the `ChatEvent` schema (see x-event-schema)."
