openapi: 3.1.0
info:
  title: "Meridian AI service agent: UI contracts"
  version: 0.1.0-ux3
  summary: UX-3 proposal for CON-1 to CON-22. Specified, not agreed.
  description: |-
    What each screen of the Meridian Home Comfort chat, demo tools, staff console and report pages needs from the backend. **Status: specified (UX-3, proposal)** until the section 6 design gate. Everything here is synthetic (the issued test data MHC-10002 and INV-204411 are allowed).

    Conventions (adopting DO-4's UXR-1): HTTP 4xx and 5xx only for requests the server could not process; composed outcomes (named errors, limits, timeout, busy, paused) are HTTP 200 with an `error` block or a `notice`, always with `settled`. Times are ISO 8601 America/Chicago on the demo clock. Cookies: one session cookie, `mhc_session`, set by login (CON-22), carrying the current role; `mhc_demo` and `mhc_staff` are retired.

    **The whole deployment is behind one demo login (decided 2026-10-21, R-48):** every route except `login` and `/healthz` answers 401 UNAUTHENTICATED without a session. Card text, data classes and access: see UI_CONTRACTS.md.
  license:
    name: Internal project document
    identifier: LicenseRef-Internal
servers:
  - url: http://localhost:4019
    description: Prism mock (UX-4)
tags:
  - name: chat
    description: Customer chat (SCR-1)
  - name: demo-only
    description: Demo operations that exist only to run the simulation (inbox, staffing, clock, reset). Also tagged by their group.
  - name: demo
    description: Demo tools (SCR-2, SCR-3, SCR-7)
  - name: staff
    description: Staff console (SCR-4 to SCR-9)
  - name: reports
    description: Read-only report pages (SCR-10, SCR-11)
  - name: session
    description: Demo login, session and role switch (SCR-12 and the shared header)
