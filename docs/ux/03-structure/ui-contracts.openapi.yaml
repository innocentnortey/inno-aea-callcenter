        role: *a6
        display_name:
          type: string
        sees:
          type: array
          items:
            type: string
        signed_in_at:
          type: string
          format: date-time
      description: The signed-in demo session and its current role. No username or password is ever returned.
    SwitchRoleRequest:
      type: object
      required:
        - role
      properties:
        role: *a6
      description: "No passcode (decided, R-48): the role switch is a label for the reviewer, not security. The login is the gate."
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          description: "Compared with the Railway variable MERIDIAN_DEMO_USERNAME. DATA CLASS: secret (D3-like); never logged or traced."
        password:
          type: string
          format: password
          description: Compared with MERIDIAN_DEMO_PASSWORD. Never logged, traced or returned.
    LoginResponse:
      type: object
      required:
        - session
        - landing
      properties:
        session:
          $ref: "#/components/schemas/SessionInfo"
        landing:
          type: string
          description: "Where the page goes next: the customer chat, /"
      description: A new login session starts as the customer role.
  responses:
    ValidationError:
      description: "400 VALIDATION_ERROR: the body or a parameter could not be processed (names the field and the rule, never the rejected value)."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          examples:
            VALIDATION_ERROR:
              summary: Code is not 6 digits
              value:
                error:
                  code: VALIDATION_ERROR
                  field: payload.code
                  constraint: must be exactly 6 digits
                  details: null
                request_id: req_8f2a41
    SessionNotFound:
      description: "404 SESSION_NOT_FOUND: unknown thread, or one this login session does not own. Identical for both, so it reveals nothing."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          examples:
            SESSION_NOT_FOUND:
              summary: Unknown or not yours
              value:
                error:
                  code: SESSION_NOT_FOUND
                  field: null
                  constraint: null
                  details: null
                request_id: req_8f2a41
    SessionEnded:
      description: "410 SESSION_ENDED: the chat was closed by staff or ended by a demo reset. The screen shows the ended notice and 'Start a new chat'."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          examples:
            SESSION_ENDED:
              summary: Ended by reset
              value:
                error:
                  code: SESSION_ENDED
                  field: null
                  constraint: null
                  details:
                    reason: demo_reset
                request_id: req_8f2a41
    TurnInProgress:
      description: "409 TURN_IN_PROGRESS: the same turn_id is still running; no second worker is started. Retry after a moment with the same turn_id."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          examples:
            TURN_IN_PROGRESS:
              summary: Still running
              value:
                error:
                  code: TURN_IN_PROGRESS
                  field: null
                  constraint: null
                  details:
                    retry_after_ms: 2000
                request_id: req_8f2a41
    ResetInProgress:
      description: "503 RESET_IN_PROGRESS: CON-9 holds its exclusive lock. Try again in a few seconds."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          examples:
            RESET_IN_PROGRESS:
              summary: Reset running
              value:
                error:
                  code: RESET_IN_PROGRESS
                  field: null
                  constraint: null
                  details:
                    retry_after_ms: 5000
                request_id: req_8f2a41
    RoleNotAllowed:
      description: "403 ROLE_NOT_ALLOWED: the current role can't do this (for example the customer role calling a staff route, or a representative assigning a case). details.reason is wrong_role, or role_reset after a demo reset sent the role back to customer. Replaces STAFF_AUTH_REQUIRED for \"signed in but wrong role\"."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          examples:
            ROLE_NOT_ALLOWED:
              summary: Role refused
              value:
                error:
                  code: ROLE_NOT_ALLOWED
                  field: null
                  constraint: null
                  details:
                    role: representative
                    needs:
                      - supervisor
                request_id: req_8f2a41
            ROLE_NOT_ALLOWED_ROLE_RESET:
              summary: The demo was reset and the role went back to customer
              value:
                error:
                  code: ROLE_NOT_ALLOWED
                  field: null
                  constraint: null
                  details:
                    role: customer
                    needs:
                      - representative
                      - supervisor
                      - owner
                    reason: role_reset
                request_id: req_8f2a41
    CaseNotFound:
      description: "404 CASE_NOT_FOUND: no such case, possibly cleared by a demo reset."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          examples:
            CASE_NOT_FOUND:
              summary: Cleared by reset
              value:
                error:
                  code: CASE_NOT_FOUND
                  field: null
                  constraint: null
                  details:
                    reference: MHC-C-0099
                request_id: req_8f2a41
    TooManyRequests:
      description: "429 REQUEST_RATE_LIMITED: too many requests from this IP (R-41). Not the chat's RATE_LIMITED, which is a 200 notice on a turn. Wait and retry."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          examples:
            REQUEST_RATE_LIMITED:
              summary: Per-IP limit
              value:
                error:
                  code: REQUEST_RATE_LIMITED
                  field: null
                  constraint: null
                  details:
                    retry_after_ms: 10000
                request_id: req_8f2a41
    Unauthenticated:
      description: "401 UNAUTHENTICATED: no valid demo login session. Every route except login and /healthz answers this. The page shows the login screen (SCR-12). details.reason is none or expired."
      headers:
        X-Request-ID:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          examples:
            UNAUTHENTICATED:
              summary: No session
              value:
                error:
                  code: UNAUTHENTICATED
                  field: null
                  constraint: null
                  details:
                    reason: none
                request_id: req_8f2a41
            UNAUTHENTICATED_EXPIRED:
              summary: Session expired
              value:
                error:
                  code: UNAUTHENTICATED
                  field: null
                  constraint: null
                  details:
                    reason: expired
                request_id: req_8f2a41
    LoginFailed:
      description: "401 LOGIN_FAILED: one message for every cause (wrong username, wrong password, empty). Never says which."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          examples:
            LOGIN_FAILED:
              summary: Wrong credentials
              value:
                error:
                  code: LOGIN_FAILED
                  field: null
                  constraint: null
                  details: null
                request_id: req_8f2a41
    LoginRateLimited:
      description: "429 LOGIN_RATE_LIMITED: too many attempts from this IP. Wait and retry."
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          examples:
            LOGIN_RATE_LIMITED:
              summary: Too many attempts
              value:
                error:
                  code: LOGIN_RATE_LIMITED
                  field: null
                  constraint: null
                  details:
                    retry_after_ms: 30000
                request_id: req_8f2a41
