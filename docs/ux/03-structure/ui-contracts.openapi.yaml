                        - technician
                        - member_only
                        - taken
                required:
                  - date
                  - label
                  - open_count
                  - windows
            standard_fee:
              $ref: "#/components/schemas/Money"
            hint:
              type: string
            members_note:
              type:
                - string
                - "null"
