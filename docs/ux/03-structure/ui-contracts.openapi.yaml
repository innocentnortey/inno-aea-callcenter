    ConfirmationBlock:
      allOf:
        - $ref: "#/components/schemas/BlockBase"
        - type: object
          required:
            - type
            - appointment_id
            - date
            - window_label
            - technician
            - fee_line
            - timeline
            - free_change_note
          properties:
            type:
              const: confirmation
            appointment_id:
              type: integer
            date:
              type: string
              format: date
            window_label:
              type: string
            technician:
              type: string
            fee_line:
              type: string
            timeline:
              type: array
              items:
                type: string
            free_change_note:
              type: string
      description: Only after a committed booking write (see writes[]).
    AppointmentBlock:
      allOf:
        - $ref: "#/components/schemas/BlockBase"
        - type: object
          required:
            - type
            - appointment_id
            - date
            - window_label
            - technician
            - fee_line
            - label
          properties:
            type:
              const: appointment
            appointment_id:
              type: integer
            date:
              type: string
              format: date
            window_label:
              type: string
            technician:
              type: string
            fee_line:
              type: string
            label:
              const: Your booked visit
    CancelledBlock:
      allOf:
        - $ref: "#/components/schemas/BlockBase"
        - type: object
          required:
            - type
            - appointment_id
            - date
            - fee_line
          properties:
            type:
              const: cancelled
            appointment_id:
              type: integer
            date:
              type: string
              format: date
            fee_line:
              type: string
              description: There's no fee.
      description: Only after a committed cancel write, more than 24 hours out.
    AccountCardBlock:
      allOf:
        - $ref: "#/components/schemas/BlockBase"
        - type: object
          required:
            - type
            - kind
            - invoice
            - membership
            - warranty
          properties:
            type:
              const: account_card
            kind:
              type: string
              enum:
                - invoice
                - membership
                - warranty
            invoice:
              oneOf:
                - type: object
                  properties:
                    invoice_id:
                      type: string
                    lines:
                      type: array
                      items:
                        type: object
                        properties:
                          description:
                            type: string
                          amount:
                            $ref: "#/components/schemas/Money"
                          source:
                            oneOf:
                              - $ref: "#/components/schemas/SourceChip"
                              - type: "null"
                        required:
                          - description
                          - amount
                          - source
                    total:
                      $ref: "#/components/schemas/Money"
                    balance:
                      $ref: "#/components/schemas/Money"
                    due_on:
                      type: string
                      format: date
                    paid:
                      type: boolean
                  required:
                    - invoice_id
                    - lines
                    - total
                    - balance
                    - due_on
                    - paid
                - type: "null"
            membership:
              oneOf:
                - type: object
                  properties:
                    tier:
                      type: string
                    renewal_date:
                      type: string
                      format: date
                  required:
                    - tier
                    - renewal_date
                - type: "null"
            warranty:
              oneOf:
                - type: object
                  properties:
                    install_date:
                      type: string
                      format: date
                    sentence:
                      type: string
                  required:
                    - install_date
                    - sentence
                - type: "null"
      description: After the code. Lines as billed, no verdict (R-17).
    ChangeRequestBlock:
      allOf:
        - $ref: "#/components/schemas/BlockBase"
        - type: object
          required:
            - type
            - change
            - fee_line
            - original_stays_line
            - wanted_text
            - windows_shown
            - reference
            - promise_text
            - due_at
            - due_label
            - extra_lines
            - cant_guarantee_line
            - phone_support_line
            - produced_by_code
          properties:
            type:
              const: change_request
            change:
              type: string
              enum:
                - move
                - cancel
            fee_line:
              type: string
              description: The $49 fee applies under current policy.
            original_stays_line:
              type: string
              description: Your original appointment stays until a representative confirms.
            wanted_text:
              type: string
            windows_shown:
              type: array
              items:
                type: object
                properties:
                  slot_id:
                    type: string
                  window_label:
                    type: string
                  date:
                    type: string
                    format: date
                required:
                  - slot_id
                  - window_label
                  - date
            reference:
              type: string
            promise_text:
              type: string
            due_at:
              type:
                - string
                - "null"
              format: date-time
              description: Null for the staffed promise ("when available", no time, R-26).
            due_label:
              type:
                - string
                - "null"
              description: Null when due_at is null.
            extra_lines:
              type: array
              items:
                type: string
            cant_guarantee_line:
              type:
                - string
                - "null"
            phone_support_line:
              type:
                - string
                - "null"
            produced_by_code:
              const: true
      description: Fee-bearing move or cancel (R-21, R-22). Windows shown, not held. The words 'charged' and 'sent' never appear.
    HandoffBlock:
      allOf:
        - $ref: "#/components/schemas/BlockBase"
        - type: object
          required:
            - type
            - card_id
            - options
            - answered
            - reference
            - variant
            - promise_text
            - due_at
            - due_label
            - extra_lines
            - produced_by_code
            - followup_chooser
          properties:
            type:
              const: handoff
            card_id:
              type: string
              description: Id of the card; posted back on a choice, code or form payload
            options:
              type: array
              items:
                $ref: "#/components/schemas/Option"
            answered:
              type:
                - string
                - "null"
              description: The option already chosen, or null
            reference:
              type: string
            variant:
              type: string
              enum:
                - nobody_online
                - refund
                - staffed
            promise_text:
              type: string
              description: "Policy-table text (R-26). The screen joins: {promise_text}, {due_label}. {extra_lines}"
            due_at:
              type:
                - string
                - "null"
              format: date-time
              description: Null for the staffed promise ("when available", no time, R-26).
            due_label:
              type:
                - string
                - "null"
              description: Null when due_at is null.
            extra_lines:
              type: array
              items:
                type: string
            produced_by_code:
              const: true
              description: Reference and promise text are produced by code, never the model (R-46). The card says so to the screen.
            followup_chooser:
              $ref: "#/components/schemas/FollowUpOptions"
    LiveQueuedBlock:
      allOf:
        - $ref: "#/components/schemas/BlockBase"
        - type: object
          required:
            - type
            - reference
            - promise_text
            - produced_by_code
          properties:
            type:
              const: live_queued
            reference:
              type: string
            promise_text:
              type: string
              description: A representative will join this chat when available. You can keep chatting with me while you wait, if you like.
            produced_by_code:
              const: true
    FailureOfferBlock:
      allOf:
        - $ref: "#/components/schemas/BlockBase"
        - type: object
          required:
            - type
            - text
            - person_key
          properties:
            type:
              const: failure_offer
            text:
              type: string
            person_key:
              type: boolean
    NoInfoBlock:
      allOf:
        - $ref: "#/components/schemas/BlockBase"
        - type: object
          required:
            - type
            - text
            - person_key
          properties:
            type:
              const: no_info
            text:
              type: string
              description: I don't have that information.
            person_key:
              type: boolean
    NoticeBlock:
      allOf:
        - $ref: "#/components/schemas/BlockBase"
        - type: object
          required:
            - type
            - code
            - text
            - person_key
          properties:
            type:
              const: notice
            code:
              type: string
              enum:
                - RATE_LIMITED
                - BOOKING_CAP
                - SPEND_CAP_REACHED
                - TURN_TIMEOUT
                - BUSY
                - AI_PAUSED
            text:
              type: string
            person_key:
              type: boolean
      description: Composed limit or timeout sentence; always with the person key.
    ErrorBlock:
      allOf:
        - $ref: "#/components/schemas/BlockBase"
        - type: object
          required:
            - type
            - code
            - text
            - tries_left
            - fresh_windows
            - person_key
          properties:
            type:
              const: error
            code:
              type: string
              enum:
                - SLOT_TAKEN
                - OUT_OF_AREA
                - CODE_WRONG
                - CODE_EXPIRED
                - CODE_LOCKED
                - CODE_CAP_REACHED
                - NOT_VERIFIED
            text:
              type: string
            tries_left:
              type:
                - integer
                - "null"
            fresh_windows:
              oneOf:
                - $ref: "#/components/schemas/SlotCardBlock"
                - type: "null"
            person_key:
              type: boolean
      description: A composed, named failure inside a normal 200 reply. NOT_VERIFIED is identical for every cause.
    SessionEndedBlock:
      allOf:
        - $ref: "#/components/schemas/BlockBase"
        - type: object
          required:
            - type
            - text
            - new_chat_action
          properties:
            type:
              const: session_ended
            text:
              type: string
            new_chat_action:
              type: string
              description: Start a new chat
    ReplyBlock:
      oneOf:
        - $ref: "#/components/schemas/TextBlock"
        - $ref: "#/components/schemas/SourceChipBlock"
        - $ref: "#/components/schemas/SafetyBlock"
        - $ref: "#/components/schemas/ConditionalSafetyBlock"
        - $ref: "#/components/schemas/BurningCheckBlock"
        - $ref: "#/components/schemas/EmergencyLineBlock"
        - $ref: "#/components/schemas/QuickChecksBlock"
        - $ref: "#/components/schemas/UrgencyQuestionsBlock"
        - $ref: "#/components/schemas/WherePromptBlock"
        - $ref: "#/components/schemas/LocatePromptBlock"
        - $ref: "#/components/schemas/CodePromptBlock"
        - $ref: "#/components/schemas/SlotCardBlock"
        - $ref: "#/components/schemas/ConfirmationBlock"
        - $ref: "#/components/schemas/AppointmentBlock"
        - $ref: "#/components/schemas/CancelledBlock"
        - $ref: "#/components/schemas/AccountCardBlock"
        - $ref: "#/components/schemas/ChangeRequestBlock"
        - $ref: "#/components/schemas/HandoffBlock"
        - $ref: "#/components/schemas/LiveQueuedBlock"
        - $ref: "#/components/schemas/FailureOfferBlock"
        - $ref: "#/components/schemas/NoInfoBlock"
        - $ref: "#/components/schemas/NoticeBlock"
        - $ref: "#/components/schemas/ErrorBlock"
        - $ref: "#/components/schemas/SessionEndedBlock"
      discriminator:
        propertyName: type
        mapping:
          text: "#/components/schemas/TextBlock"
          source_chip: "#/components/schemas/SourceChipBlock"
          safety: "#/components/schemas/SafetyBlock"
          conditional_safety: "#/components/schemas/ConditionalSafetyBlock"
          burning_check: "#/components/schemas/BurningCheckBlock"
          emergency_line: "#/components/schemas/EmergencyLineBlock"
          quick_checks: "#/components/schemas/QuickChecksBlock"
          urgency_questions: "#/components/schemas/UrgencyQuestionsBlock"
          where_prompt: "#/components/schemas/WherePromptBlock"
          locate_prompt: "#/components/schemas/LocatePromptBlock"
          code_prompt: "#/components/schemas/CodePromptBlock"
          slot_card: "#/components/schemas/SlotCardBlock"
          confirmation: "#/components/schemas/ConfirmationBlock"
          appointment: "#/components/schemas/AppointmentBlock"
          cancelled: "#/components/schemas/CancelledBlock"
          account_card: "#/components/schemas/AccountCardBlock"
          change_request: "#/components/schemas/ChangeRequestBlock"
          handoff: "#/components/schemas/HandoffBlock"
          live_queued: "#/components/schemas/LiveQueuedBlock"
          failure_offer: "#/components/schemas/FailureOfferBlock"
          no_info: "#/components/schemas/NoInfoBlock"
          notice: "#/components/schemas/NoticeBlock"
          error: "#/components/schemas/ErrorBlock"
          session_ended: "#/components/schemas/SessionEndedBlock"
    TextPayload:
      type: object
      properties:
        kind:
          const: text
        text:
          type: string
          minLength: 1
          maxLength: 2000
      required:
        - kind
        - text
      description: Free text. Goes through the safety rules and planner.
    ChoicePayload:
      type: object
      properties:
        kind:
          const: choice
        card_id:
          type: string
        option:
          type: string
      required:
        - kind
        - card_id
        - option
      description: "A card key: slot pick, yes/no, skip, show checks, send a new code. Routed by code to the open task."
    CodePayload:
      type: object
      properties:
        kind:
          const: code
        card_id:
          type: string
        code:
          type: string
          pattern: ^[0-9]{6}$
          description: "DATA CLASS: secret. Compared by code against the stored hash. Never reaches the model, logs or traces."
      required:
        - kind
        - card_id
        - code
    FormPayload:
      type: object
      properties:
        kind:
          const: form
        card_id:
          type: string
        values:
          type: object
          properties:
            name:
              type: string
            phone:
              type: string
              description: "DATA CLASS: PII"
            customer_id:
              type: string
            invoice_number:
              type: string
            zip_or_city:
              type: string
          required: []
      required:
        - kind
        - card_id
        - values
      description: "Fields from a locate or where card. UXR-3 adapted: a fourth payload kind, because locator fields are not an option value."
    TurnPayload:
      oneOf:
        - $ref: "#/components/schemas/TextPayload"
        - $ref: "#/components/schemas/ChoicePayload"
        - $ref: "#/components/schemas/CodePayload"
        - $ref: "#/components/schemas/FormPayload"
      discriminator:
        propertyName: kind
        mapping:
          text: "#/components/schemas/TextPayload"
          choice: "#/components/schemas/ChoicePayload"
          code: "#/components/schemas/CodePayload"
          form: "#/components/schemas/FormPayload"
    TurnRequest:
      type: object
      properties:
        turn_id:
          type: string
          format: uuid
          description: Minted by the browser; 'Try again' reuses it unchanged
        payload:
          $ref: "#/components/schemas/TurnPayload"
      required:
        - turn_id
        - payload
    Notice:
      type: object
      properties:
        code:
          type: string
          enum:
            - RATE_LIMITED
            - BOOKING_CAP
            - SPEND_CAP_REACHED
            - TURN_TIMEOUT
            - BUSY
            - AI_PAUSED
        actions:
          type: array
          items:
            type: string
            enum:
              - try_again
              - talk_to_person
        retry_turn_id:
          type:
            - string
            - "null"
        delivered_to_representative:
          type: boolean
          description: "AI_PAUSED only: the message went to the representative"
      required:
        - code
        - actions
        - retry_turn_id
        - delivered_to_representative
    TurnResponse:
      type: object
      properties:
        thread_id:
          type: string
        turn_id:
          type: string
        sequence:
          type: integer
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/ReplyBlock"
        settled:
          $ref: "#/components/schemas/Settled"
        writes:
          type: array
          items:
            $ref: "#/components/schemas/Write"
          description: Completed in THIS turn. Completion wording is allowed only for a kind listed here or in settled.actions.
        controller:
          type: object
          properties:
            kind:
              type: string
              enum:
                - ai
                - human
            display_name:
              type:
                - string
                - "null"
          required:
            - kind
            - display_name
        notice:
          oneOf:
            - $ref: "#/components/schemas/Notice"
            - type: "null"
        last_event_id:
          type: integer
      required:
        - thread_id
        - turn_id
        - sequence
        - blocks
        - settled
        - writes
        - controller
        - notice
        - last_event_id
      description: HTTP 200. Composed failures (limits, timeout, named errors) are blocks plus `notice`, with `settled`, never 4xx (UXR-1).
    ApiError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - UNAUTHENTICATED
                - LOGIN_FAILED
                - LOGIN_RATE_LIMITED
                - REQUEST_RATE_LIMITED
                - SESSION_NOT_FOUND
                - SESSION_ENDED
                - TURN_IN_PROGRESS
                - RESET_IN_PROGRESS
                - RESET_FAILED
                - HANDOFF_FAILED
                - ROLE_NOT_ALLOWED
                - CASE_NOT_FOUND
                - FLAG_NOT_FOUND
                - CASE_ALREADY_CLAIMED
                - VERSION_CONFLICT
                - NOT_ALLOWED_IN_STATE
                - REASON_REQUIRED
                - WAKE_UP_REQUIRED
                - OUTCOME_REQUIRED
                - NOT_LIVE
                - NOT_CLAIMED_BY_YOU
            field:
              type:
                - string
                - "null"
            constraint:
              type:
                - string
                - "null"
            details:
              type:
                - object
                - "null"
              description: Named extras, e.g. changed_by, changed_at, current_version, reason. Never the rejected value.
          required:
            - code
            - field
            - constraint
            - details
        request_id:
          type: string
      required:
        - error
        - request_id
      description: "HTTP 4xx and 5xx body: only for requests the server could not process."
    Staffing:
      type: object
      properties:
        mode:
          type: string
          enum:
            - nobody_online
            - simulated_on_shift
        label:
          type: string
          description: Nobody online | Simulated staff on shift (demo)
        banner:
          type:
            - string
            - "null"
      required:
        - mode
        - label
        - banner
    DemoClock:
      type: object
      properties:
        now:
          type: string
          format: date-time
          description: The demo clock. Starts at Fri 2026-10-16; moves only when advanced; never the server clock (R-3)
        label:
          type: string
          description: e.g. Fri Oct 16, 2026 · 2:20 pm
        date_label:
          type: string
          description: e.g. Fri Oct 16, 2026 (demo date)
      required:
        - now
        - label
        - date_label
    Limits:
      type: object
      properties:
        turn_deadline_ms:
          type: integer
          description: "Server deadline per turn, from server receipt: 60000"
        still_working_after_ms:
          type: integer
          description: "UI shows 'Still working on this…': 10000"
        browser_give_up_after_ms:
          type: integer
          description: "Browser gives up at deadline + 5 s: 65000 (decided 2026-10-21)"
        max_message_chars:
          type: integer
      required:
        - turn_deadline_ms
        - still_working_after_ms
        - browser_give_up_after_ms
        - max_message_chars
    StartSessionResponse:
      type: object
      properties:
        thread_id:
          type: string
        greeting:
          $ref: "#/components/schemas/TextBlock"
        demo_clock:
          $ref: "#/components/schemas/DemoClock"
        staffing:
          $ref: "#/components/schemas/Staffing"
        controller:
          type: object
          properties:
            kind:
              type: string
              enum:
                - ai
                - human
            display_name:
              type:
                - string
                - "null"
          required:
            - kind
            - display_name
        settled:
          $ref: "#/components/schemas/Settled"
        events:
          type: object
          properties:
            url:
              type: string
            last_event_id:
              type: integer
          required:
            - url
            - last_event_id
        limits:
          $ref: "#/components/schemas/Limits"
      required:
        - thread_id
        - greeting
        - demo_clock
        - staffing
        - controller
        - settled
        - events
        - limits
    ChatThread:
      type: object
      properties:
        thread_id:
          type: string
        state:
          type: string
          enum:
            - open
            - closed
            - ended_by_reset
        turns:
          type: array
          items:
            type: object
            properties:
              turn_id:
                type: string
              speaker:
                $ref: "#/components/schemas/Speaker"
              at:
                type: string
                format: date-time
              text:
                type:
                  - string
                  - "null"
              blocks:
                type: array
                items:
                  $ref: "#/components/schemas/ReplyBlock"
            required:
              - turn_id
              - speaker
              - at
              - text
              - blocks
        settled:
          $ref: "#/components/schemas/Settled"
        demo_clock:
          $ref: "#/components/schemas/DemoClock"
        staffing:
          $ref: "#/components/schemas/Staffing"
        last_event_id:
          type: integer
      required:
        - thread_id
        - state
        - turns
        - settled
        - demo_clock
        - staffing
        - last_event_id
      description: Resume after a reload. Codes are never in the transcript.
    HandoffRequest:
      type: object
      properties:
        turn_id:
          type: string
          format: uuid
          description: Logged as a person_requested turn; the same id returns the same result
      required:
        - turn_id
    HandoffResponse:
      type: object
      properties:
        result:
          type: string
          enum:
            - case_created
            - live_queued
            - already_open
        block:
          oneOf:
            - $ref: "#/components/schemas/HandoffBlock"
            - $ref: "#/components/schemas/LiveQueuedBlock"
        settled:
          $ref: "#/components/schemas/Settled"
      required:
        - result
        - block
        - settled
    FollowUpRequest:
      type: object
      properties:
        channel:
          type: string
          enum:
            - email
            - phone
        destination:
          type: string
          enum:
            - on_record
            - general
        window:
          type: string
          enum:
            - morning
            - afternoon
            - any
      required:
        - channel
        - destination
        - window
    FollowUpResponse:
      type: object
      properties:
        followup:
          $ref: "#/components/schemas/FollowUpView"
        settled:
          $ref: "#/components/schemas/Settled"
      required:
