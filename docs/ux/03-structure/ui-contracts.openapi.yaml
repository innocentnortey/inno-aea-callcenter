  /api/chat/sessions/{thread_id}/turns:
    post:
      operationId: submitTurn
      x-con: CON-2
      tags:
        - chat
      summary: One customer turn (message, card choice, code or form)
      description: "Every customer message and every card key goes here. The server answers HTTP 200 with typed reply blocks and `settled`, including composed outcomes (named errors in an `error` block; limits, timeout, busy and paused in a `notice`). 4xx is only for requests it could not process. **Deadline 60 s** from server receipt, then TURN_TIMEOUT; browser gives up at 65 s. **No streaming and no progress events**: the reply arrives whole. Target p95 ≤ 12.5 s. Send the same `turn_id` to retry: a finished turn returns the stored reply; a failed or timed-out one re-runs and any committed write is found by its idempotency key, not repeated. Above 30 turns in flight: BUSY at once, no model call. A representative in the chat: AI_PAUSED, the message goes to them."
      security:
        - mhcSession: []
      responses:
        "200":
          description: The reply (any of the examples)
          content:
