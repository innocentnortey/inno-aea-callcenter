        - mhcSession: []
      responses:
        "200":
          description: An event stream
          content:
            text/event-stream:
              schema:
                type: string
                description: "Server-Sent Events frames. Each data: line is one JSON event of the schema in contentSchema."
                contentMediaType: application/json
                contentSchema:
                  $ref: "#/components/schemas/ChatEvent"
